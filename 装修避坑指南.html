<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#b8541f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="装修不上当 · 移动端避坑手册：原文 12 章 + 四专家深读 + 装企对比评分、报价单漏项自查、签约复核话术、分阶段验收清单">
<title>装修不上当 · 业主避坑手册</title>
<style>
/* ==========================================================
   装修不上当 · 移动端业主避坑手册
   手机优先单页应用样式（无外部依赖，可离线）
   ========================================================== */

/* ---------- 1. 设计令牌 ---------- */
:root{
  --brand:#b8541f;
  --brand-soft:#fdf1e8;
  --brand-line:#f0c9ab;
  --ok:#1f6f52;
  --ok-soft:#eaf5f0;
  --warn:#b45309;
  --warn-soft:#fdf6e3;
  --danger:#c0392b;
  --danger-soft:#fdeceb;
  --info:#1d4ed8;
  --info-soft:#edf2ff;

  --bg:#f5f2ec;
  --bg-soft:#efeae1;
  --card:#ffffff;
  --card-2:#faf7f2;
  --text:#221f1b;
  --text-2:#57504a;
  --muted:#8a8178;
  --line:#e7e1d7;
  --shadow:0 1px 2px rgba(34,31,27,.05), 0 6px 18px -8px rgba(34,31,27,.14);
  --radius:14px;
  --radius-sm:10px;

  --fs:16px;                     /* 用户可调字号 */
  --tabbar-h:56px;

  /* 兼容原站变量名：迁移正文的内联样式仍在使用，统一映射到新令牌 */
  --text-primary:var(--text);
  --text-secondary:var(--text-2);
  --text-muted:var(--muted);
  --bg-primary:var(--bg);
  --bg-secondary:var(--bg-soft);
  --bg-card:var(--card);
  --border:var(--line);
  --accent:var(--brand);
  --accent-light:var(--brand-line);

  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
[data-theme="dark"]{
  --brand:#e08a4d;
  --brand-soft:#2a1f16;
  --brand-line:#4a3423;
  --ok:#6fcf9b;
  --ok-soft:#152a22;
  --warn:#e0a33c;
  --warn-soft:#2a2213;
  --danger:#ef7062;
  --danger-soft:#2b1a18;
  --info:#8ab0ff;
  --info-soft:#1a2033;

  --bg:#12110f;
  --bg-soft:#1a1815;
  --card:#1c1a17;
  --card-2:#242019;
  --text:#ece6dc;
  --text-2:#bdb5aa;
  --muted:#8d857b;
  --line:#2b2823;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
}

/* ---------- 2. 基础重置 ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:var(--fs);
  line-height:1.75;
  color:var(--text);
  background:var(--bg-soft);
  overscroll-behavior-y:none;
}
img{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:700;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding-left:1.25em}
ul{list-style:none;padding-left:0}

/* ---------- 3. 布局骨架 ---------- */
.app-root{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 12px);
  box-shadow:0 0 0 1px var(--line);
}
.view{padding:0 0 24px}
.pad{padding-left:16px;padding-right:16px}

.boot-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:14px;color:var(--muted)}
.boot-spinner{width:26px;height:26px;border:3px solid var(--brand-line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.read-progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;pointer-events:none;background:transparent}
.read-progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .08s linear}

/* ---------- 4. 顶部条 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  padding:calc(10px + var(--safe-t)) 16px 10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.topbar h1{font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;
  border-radius:10px;background:var(--bg-soft);font-size:1rem;
}

/* ---------- 5. 首页 ---------- */
.hero{
  margin:0;padding:22px 16px 24px;
  background:linear-gradient(160deg, color-mix(in srgb,var(--brand) 92%, #000) 0%, color-mix(in srgb,var(--brand) 62%, #6d2f10) 100%);
  color:#fff;
}
.hero .badge{
  display:inline-block;font-size:.72rem;letter-spacing:.04em;
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);margin-bottom:10px;
}
.hero h2{font-size:1.6rem;margin-bottom:8px}
.hero p.hero-sub{font-size:.9rem;color:rgba(255,255,255,.88);line-height:1.65}
.hero-stats{display:flex;gap:8px;margin-top:16px}
.hero-stat{flex:1;background:rgba(255,255,255,.14);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.hero-stat b{display:block;font-size:1.15rem;line-height:1.2}
.hero-stat span{font-size:.7rem;color:rgba(255,255,255,.82)}

.sec{padding:20px 16px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h3{font-size:1.02rem}
.sec-head .more{font-size:.8rem;color:var(--muted)}
.eyebrow{display:block;font-size:.72rem;letter-spacing:.06em;color:var(--brand);font-weight:700;margin-bottom:4px}
.sec-note{font-size:.82rem;color:var(--muted);margin:-4px 0 12px}

.card{
  background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);border:1px solid var(--line);
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tool-card{
  display:block;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);
}
.tool-card .ico{font-size:1.3rem;display:block;margin-bottom:6px}
.tool-card b{display:block;font-size:.94rem;margin-bottom:3px}
.tool-card span{display:block;font-size:.76rem;color:var(--muted);line-height:1.55}
.tool-card.accent{border-color:var(--brand-line);background:var(--brand-soft)}

.stage-picker{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stage-picker::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:.82rem;color:var(--text-2);white-space:nowrap;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.stage-body{margin-top:12px}

.step-line{position:relative;padding-left:26px}
.step-line::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--brand-line)}
.step-line > div{position:relative;margin-bottom:12px}
.step-line > div::before{
  content:"";position:absolute;left:-22px;top:8px;width:10px;height:10px;border-radius:50%;
  background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);
}
.step-line b{display:block;font-size:.92rem}
.step-line span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}

/* ---------- 6. 章节卡 / 列表 ---------- */
.chap-list{display:flex;flex-direction:column;gap:10px}
.chap-card{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);
}
.chap-idx{
  flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:.86rem;border:1px solid var(--brand-line);
}
.chap-idx.special{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.chap-main{flex:1;min-width:0}
.chap-main b{display:block;font-size:.95rem;margin-bottom:2px}
.chap-main .sub{display:block;font-size:.78rem;color:var(--brand);margin-bottom:4px}
.chap-main .desc{display:block;font-size:.78rem;color:var(--muted);line-height:1.6}
.chap-meta{margin-top:6px;display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--muted)}
.dot-progress{flex:1;height:4px;border-radius:999px;background:var(--bg-soft);overflow:hidden}
.dot-progress i{display:block;height:100%;background:var(--ok)}

/* ---------- 7. 章节阅读页 ---------- */
.chap-hero{padding:18px 16px 6px}
.chap-hero .stage{display:inline-block;font-size:.72rem;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-line);padding:3px 9px;border-radius:999px;margin-bottom:8px}
.chap-hero h2{font-size:1.4rem;margin-bottom:6px}
.chap-hero .sub{font-size:.86rem;color:var(--text-2);margin-bottom:10px}
.chap-hero .summary{font-size:.86rem;color:var(--text-2);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius-sm);padding:11px 12px;line-height:1.7}

.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tabs button{
  flex:1;padding:9px 6px;border-radius:10px;background:var(--bg-soft);
  font-size:.85rem;color:var(--text-2);border:1px solid transparent;
}
.tabs button.on{background:var(--card);border-color:var(--brand-line);color:var(--brand);font-weight:700;box-shadow:var(--shadow)}

.reader-card{border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;background:var(--card)}
.reader-card.highlight{border-color:var(--brand-line);background:var(--brand-soft)}
.reader-card .tag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--brand);margin-bottom:5px}
.reader-card b{display:block;font-size:.94rem;margin-bottom:6px}
.reader-card ul li{position:relative;padding-left:15px;font-size:.86rem;color:var(--text-2);margin-bottom:5px}
.reader-card ul li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--brand)}

/* ---------- 8. 专家深读 ---------- */
.expert-wrap{padding:12px 16px 0}
.expert-intro{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.exp-block{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:var(--card)}
.exp-head{display:flex;align-items:center;gap:10px;padding:12px 13px;width:100%;text-align:left}
.exp-ava{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;
  font-size:.95rem;background:var(--brand-soft);border:1px solid var(--brand-line);
}
[data-expert="law"] .exp-ava{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
[data-expert="site"] .exp-ava{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
[data-expert="mat"] .exp-ava{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.exp-head .who{flex:1;min-width:0}
.exp-head .who b{display:block;font-size:.9rem}
.exp-head .who span{display:block;font-size:.72rem;color:var(--muted)}
.exp-arrow{font-size:.7rem;color:var(--muted);transition:transform .2s}
.exp-block.open .exp-arrow{transform:rotate(90deg)}
.exp-body{display:none;border-top:1px solid var(--line);padding:12px 13px}
.exp-block.open .exp-body{display:block}
.exp-item{margin-bottom:12px}
.exp-item:last-child{margin-bottom:0}
.exp-item b{display:block;font-size:.86rem;margin-bottom:3px;padding-left:9px;border-left:3px solid var(--brand);line-height:1.5}
.exp-item p{font-size:.84rem;color:var(--text-2);line-height:1.72}

.redline{border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-soft);border-radius:var(--radius);padding:13px 14px}
.redline h4{font-size:.9rem;color:var(--danger);margin-bottom:8px}
.redline li{position:relative;padding-left:18px;font-size:.84rem;margin-bottom:7px;color:var(--text-2);line-height:1.7}
.redline li::before{content:"✕";position:absolute;left:0;top:0;color:var(--danger);font-weight:700}

.talk{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.talk-item{border-bottom:1px solid var(--line)}
.talk-item:last-child{border-bottom:0}
.talk-q{padding:11px 13px;width:100%;text-align:left;display:flex;gap:9px;align-items:flex-start}
.talk-q .tag-say{flex:0 0 auto;font-size:.68rem;color:#fff;background:var(--warn);padding:2px 6px;border-radius:5px;margin-top:3px}
.talk-q span{flex:1;font-size:.85rem;line-height:1.65}
.talk-a{display:none;padding:0 13px 13px;border-top:1px dashed var(--line);margin-top:2px;padding-top:10px}
.talk-item.open .talk-a{display:block}
.talk-a .line{display:flex;gap:9px;margin-bottom:8px}
.talk-a .line:last-child{margin-bottom:0}
.talk-a .k{flex:0 0 auto;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:4px}
.k-ask{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.k-why{background:var(--info-soft);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.talk-a p{flex:1;font-size:.84rem;color:var(--text-2);line-height:1.72}

/* ---------- 9. 原文迁移内容（重排为手机版） ---------- */
.body-wrap{padding:14px 16px 0;font-size:.94rem}
.body-wrap h3,.body-wrap h4{font-size:1rem;margin:6px 0 8px}
.body-wrap p{font-size:.9rem;color:var(--text-2);line-height:1.8;margin-bottom:10px}
.body-wrap strong{color:var(--text);font-weight:700}
.body-wrap ul li,.body-wrap ol li{font-size:.88rem;color:var(--text-2);line-height:1.75;margin-bottom:7px;position:relative;padding-left:15px}
.body-wrap ul li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--brand-line)}
.body-wrap ol{padding-left:0;counter-reset:li}
.body-wrap ol li{counter-increment:li;padding-left:26px}
.body-wrap ol li::before{content:counter(li);position:absolute;left:0;top:.28em;width:18px;height:18px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-size:.72rem;font-weight:700;display:grid;place-items:center;border:1px solid var(--brand-line)}

/* 提示类盒子 */
.body-wrap .tip-box,.body-wrap .info-box,.body-wrap .warning-box,.body-wrap .success-box{
  border-radius:var(--radius);padding:13px 14px;margin-bottom:14px;border:1px solid var(--line);background:var(--card);
}
.body-wrap .tip-box{border-left:4px solid var(--brand);background:var(--brand-soft)}
.body-wrap .info-box{border-left:4px solid var(--info);background:var(--info-soft)}
.body-wrap .warning-box{border-left:4px solid var(--warn);background:var(--warn-soft)}
.body-wrap .success-box{border-left:4px solid var(--ok);background:var(--ok-soft)}
.body-wrap .tip-box h4,.body-wrap .info-box h4,.body-wrap .warning-box h4,.body-wrap .success-box h4{font-size:.95rem;margin-bottom:7px}

/* 卡片网格 → 手机单列 */
.body-wrap .content-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.body-wrap .flow-steps{display:flex;flex-direction:column;gap:10px}
.body-wrap .flow-step{display:flex;gap:10px;align-items:flex-start}
.body-wrap .step-number{
  flex:0 0 24px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:var(--brand);color:#fff;font-size:.76rem;font-weight:700;margin-top:2px;
}
.body-wrap .step-content{flex:1;min-width:0}
.body-wrap .step-title{font-weight:700;font-size:.9rem;margin-bottom:2px}
.body-wrap .step-desc{font-size:.84rem;color:var(--text-2);line-height:1.7}

/* 套路卡 */
.body-wrap .trap-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.body-wrap .trap-card{border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;background:var(--card);box-shadow:var(--shadow)}
.body-wrap .trap-card h4,.body-wrap .trap-title{font-size:.92rem;margin-bottom:6px;color:var(--danger)}
.body-wrap .trap-desc{font-size:.85rem;color:var(--text-2);line-height:1.7;margin-bottom:8px}
.body-wrap .trap-detail{font-size:.84rem;color:var(--text-2);line-height:1.72}
.body-wrap .trap-detail p:last-child{margin-bottom:0}
.body-wrap .how-fake,.body-wrap .how-beat,.body-wrap .how-ask{
  border-left:3px solid var(--line);padding:6px 0 6px 10px;margin-bottom:6px;
}
.body-wrap .how-fake{border-left-color:var(--danger)}
.body-wrap .how-beat{border-left-color:var(--ok)}
.body-wrap .how-ask{border-left-color:var(--info)}
.body-wrap .how-fake b,.body-wrap .how-beat b,.body-wrap .how-ask b{display:block;font-size:.78rem;letter-spacing:.02em;margin-bottom:2px}
.body-wrap .how-fake b{color:var(--danger)}
.body-wrap .how-beat b{color:var(--ok)}
.body-wrap .how-ask b{color:var(--info)}
.body-wrap .how-fake p,.body-wrap .how-beat p,.body-wrap .how-ask p{font-size:.84rem;margin-bottom:0;line-height:1.7}

/* 表格横向滚动 */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius)}
.body-wrap table,.body-wrap .material-table{border-collapse:collapse;width:100%;min-width:460px;font-size:.82rem;background:var(--card)}
.body-wrap th,.body-wrap td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;line-height:1.65}
.body-wrap th{background:var(--bg-soft);font-weight:700;color:var(--text);white-space:nowrap;font-size:.8rem}
.body-wrap tbody tr:last-child td{border-bottom:0}
.body-wrap tr td strong,.body-wrap tr th strong{color:var(--text)}

/* 章节翻页 */
.chap-nav{display:flex;gap:10px;padding:18px 16px 0}
.chap-nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:11px 10px;font-size:.84rem;box-shadow:var(--shadow);text-align:left}
.chap-nav button[disabled]{opacity:.45}
.chap-nav .next{text-align:right}

/* ---------- 10. 工具：清单 ---------- */
.tool-hero{padding:16px 16px 0}
.tool-hero h2{font-size:1.25rem;margin-bottom:6px}
.tool-hero p{font-size:.84rem;color:var(--muted);line-height:1.7}
.stat-bar{display:flex;gap:8px;margin:12px 0 0}
.stat-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat-box b{display:block;font-size:1.15rem;color:var(--brand);line-height:1.3}
.stat-box span{font-size:.7rem;color:var(--muted)}

.progress-line{margin:14px 16px 0}
.progress-track{height:8px;border-radius:999px;background:var(--bg-soft);overflow:hidden;border:1px solid var(--line)}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#e08a4d);transition:width .3s}
.progress-txt{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:5px}

.filters{display:flex;gap:6px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

.acc{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:12px 16px 0;background:var(--card)}
.acc-head{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.acc-head b{flex:1;font-size:.92rem;min-width:0}
.acc-count{font-size:.72rem;color:var(--muted);flex:0 0 auto}
.acc-body{display:none;border-top:1px solid var(--line)}
.acc.open .acc-body{display:block}

/* 原图流程主线时间线 */
.tl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.tl-line{

}
.tl-line::before{
  content:'';position:absolute;left:24px;right:24px;top:30px;height:2px;

}

.tl-node .tl-d{font-size:.62rem;color:var(--warn);height:14px;line-height:14px}

}
.tl-node .tl-n{

}

.dg-box{fill:var(--bg-soft);stroke:var(--line);stroke-width:1}

.dg-x{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-dasharray:4 3}
.dg-badx{fill:none;stroke:var(--danger);stroke-width:3}
.dg-surface{fill:none;stroke:var(--info);stroke-width:1.6}

.dg-dim{fill:none;stroke:var(--brand);stroke-width:1.2}

.dg-tile{fill:var(--card-2);stroke:var(--line);stroke-width:1.5}

.dg-lay-n2{fill:var(--brand-soft);stroke:var(--brand-line);stroke-width:1}

.dg-c-n{fill:#1d4ed8}
.dg-c-e{fill:#9aa828}

.dg-tb{fill:var(--brand);font-size:12px;font-weight:700}
.dg-tok{fill:var(--ok);font-size:11px;font-weight:700}
.dg-tbad{fill:var(--danger);font-size:11px;font-weight:700}

/* 图解卡片 */
.dg-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:12px}
.dg-canvas{padding:14px 12px 10px;background:var(--card)}
.dg-meta{padding:12px 14px 14px;border-top:1px solid var(--line)}
.dg-std{

}
.dg-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dg-row:first-of-type{border-top:0}

.dg-row .v{flex:1;font-size:.82rem;line-height:1.7;color:var(--text-2);min-width:0}
.dg-row.bad .v{color:var(--danger)}

.dg-cats{display:flex;gap:7px;overflow-x:auto;padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.dg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dg-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;text-align:left;padding:0;
}
.dg-item .thumb{padding:8px 8px 2px;background:var(--bg-soft)}
/* 缩略图里字号放大，缩小后仍能看清 */
.dg-item .thumb .dg-t{font-size:24px}
.dg-item .thumb .dg-tb{font-size:26px}

.dg-item b{display:block;font-size:.8rem;padding:6px 10px 8px;line-height:1.45}

}

  "body": "<div class=\"tip-box\">\n                        <h4>💡 验房最重要的，不是“查得多”，而是“查出问题后能追得动”</h4>\n                        <p>很多业主验房时最大的问题，不是没看，而是<strong>看到了问题却没有证据、没有记录、没有让对方确认</strong>。结果装修一开始，开发商、物业、施工方就互相推责任，最后只能自己认。验房真正的作用，是在装修之前把能追责的问题尽量暴露出来，并且把它们变成可整改、可复核、可留痕的事项。你在这一章最该记住的，不是背多少检查项目，而是掌握一套顺序：<strong>先看大问题，再看细节；先留证据，再谈整改；先让对方确认，再进入装修</strong>。</p>\n                    </div>\n                    <div class=\"content-grid\">\n                        <div class=\"info-box success-box\">\n                            <h4>🧭 验房最稳的 5 步顺序（避免东看一下、西看一下，最后什么都没记住）</h4>\n                            <div class=\"flow-steps\">\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">1</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">先看会不会影响后续装修的大问题</div>\n                                        <div class=\"step-desc\">优先查渗漏、空鼓、门窗变形、墙地面大面积开裂、强弱电是否可用、下水是否通畅。这些问题一旦等到装修后才发现，返工成本会成倍增加，还容易出现责任扯皮。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">2</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">按空间逐一检查，不要靠记忆跳着看</div>\n                                        <div class=\"step-desc\">建议按“入户门 → 客餐厅 → 卧室 → 厨房 → 卫生间 → 阳台”顺序走，每个空间只做一件事：看完、拍照、记录。越是看似简单的流程，越能防止漏项。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">3</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">发现问题先拍全景，再拍细节，再拍位置</div>\n                                        <div class=\"step-desc\">不要只拍一个局部特写。正确做法是：先拍整面墙/整个区域，再拍问题近景，最后拍门牌号、房间位置或有参照物的画面。这样后面别人就很难说“你拍的这不是你家”或“看不出具体在哪”。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">4</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">把问题写成“位置 + 现象 + 处理要求”</div>\n                                        <div class=\"step-desc\">例如不要只写“墙面有问题”，而要写成“次卧窗边右下角墙面疑似渗水返碱，需排查原因并修复后复验”。只写“有问题”没用，后面很容易被含糊处理。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">5</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">整改完成后必须复验，不要只听一句“已经弄好了”</div>\n                                        <div class=\"step-desc\">很多整改只是表面补一下、擦一下、重打一点胶，真正根因并没有处理。尤其渗水、空鼓、门窗、下水、电路这类问题，一定要复验，不然你会在装修或入住后第二次买单。</div>\n                                    </div>\n                                </div>\n                            </div>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>📋 精装修房验收：重点不是“好不好看”，而是“能不能正常住”</h4>\n                            <p style=\"color:var(--text-secondary);font-size:0.9rem;margin-bottom:1rem;\">精装房最容易让人放松警惕，因为开发商会把表面做好看。但你真正该盯的，是那些入住后天天都会碰到、出问题最烦的地方。</p>\n                            <ul>\n                                <li><strong>强电系统：</strong> 插座逐个通电测试，零火线别接反，漏保按测试键要能正常跳闸。</li>\n                                <li><strong>弱电系统：</strong> 网口、电视口、弱电箱配置要实测，不要只看面板装得整齐。</li>\n                                <li><strong>门窗：</strong> 开关顺不顺、锁点紧不紧、胶条是否完整、玻璃有没有 3C 标识和破损。</li>\n                                <li><strong>墙地面：</strong> 瓷砖空鼓、木地板异响、墙面修补痕、踢脚线收口都要查。</li>\n                                <li><strong>下水与防臭：</strong> 厨卫放水看排水速度、返味情况、地漏是否通畅。</li>\n                                <li><strong>柜体与五金：</strong> 抽屉、铰链、封边、层板稳固度都关系到后面耐不耐用。</li>\n                                <li><strong>设备功能：</strong> 新风、空调、烟机、热水设备能试就试，不要默认“交付时一定正常”。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🏠 毛坯房验收：重点不是“现在能不能住”，而是“以后好不好装”</h4>\n                            <p style=\"color:var(--text-secondary);font-size:0.9rem;margin-bottom:1rem;\">毛坯房看起来内容少，其实更值得认真查，因为它的很多问题会直接影响后面的装修基础。你现在不追，后面就容易变成你自己的施工问题。</p>\n                            <ul>\n                                <li><strong>三书一证一表：</strong> 资料不齐先别急着签字，至少把交付依据留好。</li>\n                                <li><strong>墙地面空鼓与平整：</strong> 尤其厨房、卫生间、阳台和后续要贴砖的位置，最值得提前查。</li>\n                                <li><strong>渗漏与水印：</strong> 卫生间、厨房、阳台、窗边、顶面，都是高风险位置。</li>\n                                <li><strong>门窗与玻璃：</strong> 变形、漏风、裂纹、胶缝开裂，越早发现越好追责。</li>\n                                <li><strong>烟道、排烟与下水：</strong> 不通、倒灌、堵塞这类问题后期会很烦。</li>\n                                <li><strong>原始电路与点位：</strong> 即使后面要改电，也要先知道交付基础到底合不合格。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box warning-box\">\n                            <h4>⚠️ 验房最容易吃亏的 5 种情况</h4>\n                            <ul>\n                                <li><strong>只看表面，不留证据：</strong> 当场觉得“这个得修”，回家后没有照片和记录，基本等于白看。</li>\n                                <li><strong>整改要求太模糊：</strong> 只写“修复处理”没用，必须写清位置和问题现象。</li>\n                                <li><strong>相信口头承诺：</strong> “放心后面给你弄”这种话，没有书面确认几乎没有价值。</li>\n                                <li><strong>物业或开发商催着快签：</strong> 越催越说明你更要慢一点，签字意味着后面很多事会变难。</li>\n                                <li><strong>没做复验就开始装修：</strong> 一旦你开工，很多原始责任边界就会被打乱。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>📝 证据怎么留，后面才真的追得动</h4>\n                            <ul>\n                                <li><strong>每个问题至少留 3 张图：</strong> 全景、近景、带位置参照的图。</li>\n                                <li><strong>视频比单张照片更有说服力：</strong> 特别是漏水、异响、门窗不顺、排水不畅这类动态问题。</li>\n                                <li><strong>文字记录要能复述给第三方听懂：</strong> 不要只写“空鼓”“漏水”，而要写位置和表现。</li>\n                                <li><strong>能让对方签收或确认最好：</strong> 微信、物业群、验房单、邮件都比口头强。</li>\n                                <li><strong>整改前后都要留档：</strong> 不然很难证明问题有没有真正处理。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🔍 业主在验房现场最该追问的 5 个问题</h4>\n                            <ul>\n                                <li><strong>“这个问题你们怎么记录？什么时候整改？谁负责回访？”</strong> 先把责任链条问出来。</li>\n                                <li><strong>“整改后我怎么复验？复验不过怎么办？”</strong> 防止对方只做一次表面处理。</li>\n                                <li><strong>“这是交付问题，还是后续装修前需要我自己处理的问题？”</strong> 责任边界必须提前说清。</li>\n                                <li><strong>“如果我今天不签字，流程会怎样走？”</strong> 很多催签本质上是在制造心理压力。</li>\n                                <li><strong>“能不能把这个问题按房间位置写进验房记录，而不是只写一个笼统描述？”</strong> 这句话特别有用，能明显提高整改质量。</li>\n                            </ul>\n                        </div>\n                    </div>"
 },

  "body": "<div class=\"tip-box\">\n                        <h4>💡 装修前最重要的事</h4>\n                        <p>装修最怕两件事：一是被装修公司忽悠，二是钱不够做到一半停工。所以在开工前，你要搞清楚自己的预算底线，摸清装修公司的套路，选对装修方式。记住：装修公司的销售话术都是精心设计的，你听到的每一个“优惠”背后都有利润空间。千万不要在销售现场冲动交定金！</p>\n                    </div>\n                    <div class=\"info-box warning-box\">\n                        <h4>🚨 装修公司套路大全（30+种）</h4>\n                        <p style=\"color:var(--text-secondary);font-size:0.9rem;margin-top:0.75rem;\">以下是装修公司最常见的套路，每一条都有无数业主踩过坑。签合同前逐条对照，看看你的报价单里藏了多少猫腻。</p>\n                    </div>\n                    <div class=\"trap-grid\">\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 设计费全免</div>\n                            <div class=\"trap-desc\">他们怎么说：\"设计费全免！价值2万的设计白送你！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>设计师不是做慈善，免设计费的前提是你必须在他们指定的商家买材料。设计师带你去选材，每一家都给设计师返点（通常15%-30%），你买得越贵，设计师赚得越多。如果你自己去买，设计师就不出图、不跟进，后期施工问题全推给你。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>问清楚免设计费的条件。如果必须买指定材料，算算总差价——你会发现\"免费\"的设计比付费的贵得多。宁可花5000-8000请独立设计师，也不接受捆绑消费。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 水电报低价</div>\n                            <div class=\"trap-desc\">他们怎么说：\"水电全包只要8000，别人家都报1万5！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>8000是\"预估价\"，合同里写的是\"按实际发生量结算\"。结果水电走完一算，2万起步。因为\"预估\"只算了最少点位，你家不可能只装那么少插座。而且水电是隐蔽工程，一旦做好了你看不到管子走向，只能付钱。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>合同必须写明水电上限（如\"水电改造总价不超过12000元，超出部分由乙方承担\"）。要求出详细水电图，标明每个点位，按图施工按图验收。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 零增项承诺</div>\n                            <div class=\"trap-desc\">他们怎么说：\"我们承诺零增项，合同价就是最终价！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>\"零增项\"不等于\"不涨价\"。合同里故意漏掉很多必做项目：防水只报1遍（要做2-3遍）、墙面只报刮2遍腻子（要做3遍）、插座只算10个（你家需要30+个）……这些都是\"漏项\"，不是\"增项\"，所以\"零增项承诺\"完全合法。真正开工后，漏掉的全要加钱。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>不要看\"零增项\"，要看合同附的详细报价单。逐项对照你家的实际需求，要求把所有必做项目写进去。关键问一句：\"还有没有没列进来的必做项目？\"让对方书面确认。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 七天退款</div>\n                            <div class=\"trap-desc\">他们怎么说：\"不满意七天无理由退款，你放心！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>交完定金后，设计师开始频繁联系你、出方案、约你看样板间……七天里你忙得没时间细想。等你第七天想退，对方说\"方案已经出了，属于定制服务，不能退\"。就算真能退，流程漫长，各种扣费，到手可能只剩一半。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>不要在现场交定金！再优惠也要回去冷静3天。如果一定要交，写收据而不是合同，收据上注明\"可全额退还\"，拍照留存。法律规定定金不超过总价20%，超过部分可以要求退还。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 拎包入住</div>\n                            <div class=\"trap-desc\">他们怎么说：\"全屋硬装+软装一价全包，拎包就住！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>\"全包\"的定义非常窄。不含窗帘、不含活动家具（沙发、餐桌椅、床架）、不含灯具、不含家电、不含开关面板……说是拎包入住，其实还差一半东西要自己买。而且全包里的软装品质很差，想换好的？加钱。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>要求对方列出\"全包\"包含和不包含的完整清单，不包含的标注市场价。对比下来，你多半会发现\"全包\"比半包+自购更贵。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 工程量少算</div>\n                            <div class=\"trap-desc\">他们怎么说：\"我们这报价很低，比别家便宜30%！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>低价是因为工程量故意少算。墙面面积按建筑面积而不是实际面积算、吊顶只算客厅不算过道、防水只算地面不算墙面……装修开始后，\"实际工程量\"远超预算，超出的部分单价往往比正常价高20%-50%。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>自己量一遍面积，和报价单对。合同里加一条：\"实际工程量与预算偏差超过5%的，超出部分由乙方承担\"。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 送家电</div>\n                            <div class=\"trap-desc\">他们怎么说：\"签约送全套家电！空调冰箱洗衣机全有！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>送的家电是最便宜的低端款，噪音大、能效低、容易坏。想换好的？\"可以啊，补差价就行\"——差价加上去，总价和别人家不送家电的一样。本质上家电钱早就算在报价里了，还多赚你一笔。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>问两个价：送家电和不送家电分别多少。你会发现不送的更便宜，省下的钱自己买能选更好的。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 面积套路</div>\n                            <div class=\"trap-desc\">他们怎么说：\"我们按实际使用面积算，不收公摊！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>\"实际使用面积\"可能是含墙体面积的，比你的套内面积大不少。而且不同公司计算方式不同，有的按建筑面积、有的按套内面积、有的按实测面积——但你不知道哪个划算，因为单价也不同。低价+大面积，总价反而更高。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>不要比单价，比总价。要求按你的房产证面积×单价报价，白纸黑字写死面积数和计算方式。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 铺瓷砖加价</div>\n                            <div class=\"trap-desc\">他们怎么说：\"铺砖50一平，很实惠！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>50块是\"基础铺贴费\"。开工后你会发现：过门石+50/条、波导线+30/米、薄贴法（大砖必须用）+20/平、对缝+15/平、阳角碰角+25/米、切割费+10/米、异形铺贴翻倍……最后实际每平100+。而且这些全是\"合同外项目\"，不付就停工。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>签合同前问清楚所有铺砖相关费用，要求写进报价单。重点问：过门石、波导线、薄贴、对缝、碰角、切割，这几项加起来比铺贴费本身还贵。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 吊顶加价</div>\n                            <div class=\"trap-desc\">他们怎么说：\"客餐厅吊顶全包，含人工材料！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>报价只含最简单的平顶。如果你要装中央空调或新风，需要做下挂吊顶包管道，这部分不在报价内，另外加3000-5000。灯槽、弧形造型、双眼皮吊顶，每一项都额外加钱。不做？那管线裸露着，你忍不了只能加钱。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>提前确定要不要装中央空调/新风，在报价阶段就要求包含设备吊顶。造型吊顶也要提前确认并写入报价。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 材料选择套路</div>\n                            <div class=\"trap-desc\">他们怎么说：\"我们用的是XX品牌正品，品质有保障！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>合同只写品牌不写型号，用该品牌最差的工程款（专供装修公司的低配版，质量比零售版差很多）。或者做到一半告诉你\"这个型号没货了，推荐你换这款\"——换的更贵。辅材更坑：合同写\"品牌腻子\"，实际用的杂牌，你根本分不出来。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>合同必须写明品牌+型号+规格，主材和辅材都要写。材料进场时拍照核对，不对的拒收。加一条：\"未经甲方书面同意，不得更换任何材料品牌及型号\"。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 地面找平</div>\n                            <div class=\"trap-desc\">他们怎么说：\"你家地面不平，得做找平，不然铺不了地板\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>有些地面确实需要找平，但很多装修公司夸大不平程度，多报找平厚度。比如只需要5mm自流平，报15mm水泥砂浆找平，面积还多算。一平差30-50块，全屋多花大几千。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>要求用靠尺实测，当场给你看偏差数据。偏差＜5mm用自流平即可（便宜），偏差5-15mm用水泥砂浆，超过15mm要先处理原地面。找平厚度和方式写进合同。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 洁具全包</div>\n                            <div class=\"trap-desc\">他们怎么说：\"马桶花洒水龙头全包，不用你操心！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>\"全包\"只限指定品牌的指定款式（通常是滞销款或工程款），想换其他品牌或其他款式？加钱。而且这些指定款市场价可能只要报价的1/3。更过分的是，有些\"全包\"不包含角阀、软管等安装配件，装的时候另外收费。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>要求看实物（不是图片），在网上搜同款比价。洁具建议自购，花同样的钱能买到好得多的产品。如果全包，确认配件是否齐全，品牌型号写进合同。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 橱柜全包</div>\n                            <div class=\"trap-desc\">他们怎么说：\"3米地柜+1米吊柜全包，够用了！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>3米地柜1米吊柜根本不够用！正常厨房至少需要4-5米地柜+2米吊柜。不够的部分按零售价加，比合同单价贵一倍。另外台面只含最差的钙粉石英石，升级要加钱；五金铰链不含缓冲，想静音？加钱；拉手样式只有一种，想换？加钱。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>先自己量好需要的橱柜总长度，和报价单对比。要求报价按你家实际尺寸出，不要\"套餐\"。确认台面材质、五金品牌、拉手样式，全部写进合同。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 衣柜全包</div>\n                            <div class=\"trap-desc\">他们怎么说：\"全屋衣柜全包，不限面积！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>\"不限面积\"是骗人的，限制的是内部配置：不含抽屉（加一个300-500）、不含挂衣杆（加一根200）、不含裤架领带格、不含感应灯、隔板只有3层（正常要5-6层）。而且衣柜深度可能只做55cm（正常要60cm），挂不了大衣。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>合同写明：衣柜深度≥60cm、包含抽屉数量、挂衣杆、裤架等。画好内部布局图让对方确认签字，照图施工照图验收。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 工程管理费</div>\n                            <div class=\"trap-desc\">他们怎么说：\"5%工程管理费，行业标准，每家都收\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>所谓\"管理费\"就是给你派个项目经理（有的还兼职管好几个工地），每周来1-2次看看。5%-10%的管理费，10万的装修收5000-10000，但实际管理成本远低于此。而且\"行业标准\"根本不存在，很多公司不收或可谈。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>管理费可以谈，从5%砍到2%甚至免除。谈不下来就让对方在施工单价上再降，总价不变就行。别被\"行业标准\"唬住。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 付款套路</div>\n                            <div class=\"trap-desc\">他们怎么说：\"按工程进度付款，很合理！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>典型的付款节奏是：签约付50%、水电完付30%、油漆完付15%、验收付5%。水电做完你已经付了80%，后面发现问题，工长一句\"钱都收了差不多\"就开始敷衍了。最关键的是，5%尾款太少了，大问题（如漏水、开裂）5%根本覆盖不了维修费。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>争取付款节奏：30%→30%→25%→15%，尾款不低于10%。加一条：\"验收合格后30天内无质量问题再付尾款\"。绝对不要一次性付超过50%。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 征集样板间</div>\n                            <div class=\"trap-desc\">他们怎么说：\"您家被选为小区样板间，享受工厂价！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>每个小区都会\"征集\"10-20个\"样板间\"，你家并不特殊。所谓\"工厂价\"只是把原价虚高再打折，实际并不便宜。更重要的是，征集样板间的目的是让你尽快交定金——\"名额有限，今天就定\"。一旦交了定金，议价权就没了。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>别被\"专属\"\"限量\"冲昏头。无论什么优惠，都要拿报价单回去对比。真想做样板间，要求书面承诺：具体优惠金额、施工标准、后期带人参观的补偿方案。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 砸金蛋</div>\n                            <div class=\"trap-desc\">他们怎么说：\"今天签约砸金蛋，最高赢5000元家电！\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>金蛋里都是些低成本东西：小家电、代金券（限定使用条件）、装饰品。5000元大奖的概率无限接近零。砸金蛋的唯一目的：营造热闹氛围，让你在群体压力和兴奋状态下冲动签约。冷静下来你会发现，\"优惠\"后的价格比别人家正常报价还贵。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>记住：所有营销活动的成本都算在报价里。不参加活动、不砸金蛋、不抽奖，直接谈底价，才是真省钱。\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 口头承诺</div>\n                            <div class=\"trap-desc\">他们怎么说：\"放心，这个后面送你/帮你弄/不加钱\"</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>设计师、销售、工长说的话，只要没写进合同，等于没说。\"这个后面送你\"→后面说不送了；\"帮你升级\"→后面说没说过；\"不加钱\"→后面说这是新加的项目。最气人的是，当初承诺的那个人可能已经离职了。<br>\n                                <span class=\"how-beat\">✅ 怎么破：</span>所有承诺，无论大小，必须写进合同补充条款。对方说\"不用写，口头说就行\"，那你就说\"不写进合同我就不签\"。微信聊天记录也要保留，万一有争议，聊天记录可作为辅助证据。\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"info-box warning-box\" style=\"margin-top: 2rem;\">\n                        <h4>🚨 装修中假货最多的 5 个材料</h4>\n                        <p style=\"color:var(--text-secondary);font-size:0.9rem;margin-top:0.75rem;\">这部分最容易吃亏的，不是完全买到“三无产品”，而是<strong>拿工程款、贴牌货、擦边钢印货、低配冒充高配</strong>。销售会反复强调“都是正品”“都是一个厂出来的”，但真正影响你后期使用体验的，往往是材料等级、配置和真假混卖。下面这 5 类，属于装修里最常见、也最值得你当场核对的高风险项。</p>\n                    </div>\n                    <div class=\"trap-grid\">\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 石英石台面</div>\n                            <div class=\"trap-desc\">最常见的坑不是“完全假的石头”，而是树脂粉料比例过高的低端板，硬度、耐污和耐热都差很多。</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>销售嘴上说“石英石都差不多”，实际上高石英砂含量和低石粉树脂板，耐用度完全不是一个级别。便宜货前期看着差不多，后面容易渗色、发黄、炸裂，锅底一烫、酱油一泡就出问题。<br>\n                                <span class=\"how-beat\">✅ 怎么看：</span>不要只听“石英石”三个字，重点问<strong>品牌、系列、厚度、是否含垫板、台下盆怎么做、质保多久</strong>。要求看整板样块和检测资料。<br>\n                                <span class=\"how-ask\">🗣️ 现场追问：</span>“你给我的这块板具体是什么系列？厚度多少？合同里能不能把品牌+型号+厚度写死？”\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 304 不锈钢水槽/龙头</div>\n                            <div class=\"trap-desc\">“304”是最爱被拿来做文字游戏的材料之一，最常见的是打擦边钢印、拿低配不锈钢冒充食品级。</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>很多产品会打类似 <strong>SUS304</strong> 的模糊字样，也有用相似编号、贴标、外包装宣传来混淆。你现场只看“像是不锈钢”，后面才会发现更容易生锈、变色、起水斑。<br>\n                                <span class=\"how-beat\">✅ 怎么看：</span>不要只看钢印，还要看<strong>品牌来源、执行标准、厚度、配件、质保和购买渠道</strong>。尤其水槽别只看盆体，落水器、下水件和龙头阀芯才是后期高频翻车点。<br>\n                                <span class=\"how-ask\">🗣️ 现场追问：</span>“这个型号能不能提供产品页、执行标准和质保信息？如果我收货后发现不是约定型号，怎么退换？”\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 瓷砖产地与等级</div>\n                            <div class=\"trap-desc\">“广东砖”常被包装成品质背书，但装修里更常见的坑其实是：产地模糊、等级不明、样砖和到货砖不是一批。</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>店里展示的是花色好、平整度好的样砖，送到家里的却可能是不同批次甚至不同等级。还有些商家故意强调“广东工艺”“佛山技术”，让你误以为就是广东原厂砖。<br>\n                                <span class=\"how-beat\">✅ 怎么看：</span>先确认<strong>品牌、型号、规格、产地、等级、批次、吸水率、是否有 3C/检验信息</strong>。大砖、上墙砖还要额外确认铺贴方案和辅材要求。<br>\n                                <span class=\"how-ask\">🗣️ 现场追问：</span>“我最终到货的砖，能不能保证和展厅样砖同型号同批次？送货单和包装箱上会不会写清楚？”\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 地漏与下水五金</div>\n                            <div class=\"trap-desc\">这类单价不高，但假货、贴牌和低配替代特别多，问题一旦出现就是返味、堵塞、阀芯失灵。</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>很多人只看品牌名，不看具体型号。商家最爱拿“同品牌低配款”“外形很像的替代款”顶上，装完以后你几乎不会再拆开核对，出了问题已经埋在砖下面了。<br>\n                                <span class=\"how-beat\">✅ 怎么看：</span>地漏要看<strong>型号、材质、芯体结构、排水场景</strong>，洗衣机位、淋浴区、普通干区并不该用同一种。下单前让商家把产品图和型号写到清单里。<br>\n                                <span class=\"how-ask\">🗣️ 现场追问：</span>“淋浴区、洗衣机位、阳台地漏是不是同一型号？每个位置为什么这么配？能不能把型号写进采购单？”\n                            </div>\n                        </div>\n                        <div class=\"trap-card\">\n                            <div class=\"trap-title\">❌ 马桶与卫浴套系</div>\n                            <div class=\"trap-desc\">装修公司最爱在“品牌卫浴”上做文章：品牌是真的，但型号是工程款、清仓款或低配款，体验完全不是宣传里的那套。</div>\n                            <div class=\"trap-detail\">\n                                <span class=\"how-fake\">👉 坑在哪：</span>你以为买的是某品牌口碑款，实际到货的是冷门型号；你以为带缓降、静音、强冲、优等釉面，最后装上去的只是“同品牌基础款”。看起来都叫马桶，冲水、挂污、噪音、釉面耐久差别非常大。<br>\n                                <span class=\"how-beat\">✅ 怎么看：</span>重点核对<strong>品牌、型号、坑距、冲水方式、釉面说明、盖板配置、质保</strong>。别只看外形，最好把完整型号去电商和官网交叉核对。<br>\n                                <span class=\"how-ask\">🗣️ 现场追问：</span>“这款完整型号是什么？是不是工程专供款？官网/电商能不能查到同型号同配置？”\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"info-box\" style=\"margin-top: 2rem;\">\n                        <h4>🎯 装修避坑三大核心</h4>\n                        <p style=\"color:var(--text-secondary);font-size:0.9rem;margin:0.75rem 0 1rem;\">很多人以为装修避坑靠“懂很多材料”“会砍价”，其实真正决定你会不会翻车的，通常只有三件事：<strong>预算有没有边界、合同有没有写死、施工节点有没有验收</strong>。这三项抓住了，很多套路自然失效；这三项没抓住，哪怕你听过再多经验贴，还是会在现场被带节奏。</p>\n                        <div class=\"flow-steps\">\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">1</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">先把预算边界定住：不在销售现场做“情绪消费”决定</div>\n                                    <div class=\"step-desc\">装修最容易超支，不是因为你一开始就没钱，而是因为你没有把“硬装上限、定制上限、家电软装上限、备用金”拆开。结果销售每次只让你多加一点，最后总额失控。避坑的第一核心不是省，而是<strong>先算总盘子，再决定哪些能升级、哪些绝不碰</strong>。</div>\n                                </div>\n                            </div>\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">2</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">再把合同边界写死：所有重要承诺都必须落到纸面</div>\n                                    <div class=\"step-desc\">销售最擅长的是让你相信“这个后面再说”“这个默认都包含”“这个我们一直这么做”。但装修里一切扯皮，几乎都发生在<strong>品牌没写型号、工艺没写标准、报价没写范围、增项没写触发条件</strong>。你真正要盯的不是对方态度多好，而是合同有没有把关键条款写明。</div>\n                                </div>\n                            </div>\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">3</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">最后盯施工节点验收：隐蔽工程不过关，后面越装越被动</div>\n                                    <div class=\"step-desc\">装修里最贵的错误，往往不是买错一盏灯，而是水电、防水、基层、贴砖这类“做完就被盖住”的环节没验。等柜子装了、砖贴了、漆刷了，你再发现问题，返工成本直接翻倍。避坑的第三核心是：<strong>每个关键节点先验收、再付款、再进入下一步</strong>。</div>\n                                </div>\n                            </div>\n                        </div>\n                        <div class=\"info-box success-box\" style=\"margin-top:1rem;\">\n                            <h4>✅ 普通业主最该记住的一句话</h4>\n                            <p>装修避坑不是靠你变成半个专业人士，而是靠你建立一套<strong>不容易被带偏的决策顺序</strong>：先确定预算边界，再把合同写细，最后按节点验收。顺序对了，很多坑根本踩不进去。</p>\n                        </div>\n                    </div>\n                    <div class=\"info-box\" style=\"margin-top: 2rem;\">\n                        <h4>💰 100平自装基础装修参考费用</h4>\n                        <table class=\"material-table\">\n                            <tr>\n                                <th>项目</th>\n                                <th>人工</th>\n                                <th>材料</th>\n                                <th>说明</th>\n                            </tr>\n                            <tr>\n                                <td><strong>水电改造</strong></td>\n                                <td>~4000元</td>\n                                <td>~3300元</td>\n                                <td>含开槽、布线、水管</td>\n                            </tr>\n                            <tr>\n                                <td><strong>木工吊顶</strong></td>\n                                <td>大平顶50元/㎡<br>直线吊顶50元/米<br>双眼皮20元/米</td>\n                                <td>石膏板、龙骨</td>\n                                <td>按实际工程量计算</td>\n                            </tr>\n                            <tr>\n                                <td><strong>瓦工贴砖</strong></td>\n                                <td>50元/㎡</td>\n                                <td>辅料30元/㎡</td>\n                                <td>80平地+52平墙参考</td>\n                            </tr>\n                            <tr>\n                                <td><strong>油工刷漆</strong></td>\n                                <td>23-25元/㎡</td>\n                                <td>~10元/㎡</td>\n                                <td>含腻子、乳胶漆</td>\n                            </tr>\n                            <tr>\n                                <td><strong>其他杂项</strong></td>\n                                <td colspan=\"2\">~2000元</td>\n                                <td>垃圾清运、打孔、成品保护</td>\n                            </tr>\n                        </table>\n                    </div>\n                    <div class=\"content-grid\" style=\"margin-top: 2rem;\">\n                        <div class=\"info-box\">\n                            <h4>💰 预算评估三要素</h4>\n                            <p style=\"color:var(--text-secondary);font-size:0.9rem;margin-bottom:1rem;\">预算最怕的不是“花多一点”，而是<strong>前面看起来都能接受，后面才发现几个系统叠加起来根本兜不住</strong>。普通业主做预算，不要按“今天买什么、明天买什么”去想，而要先把整套房子的花钱结构拆成三个层级：底层硬装、功能定制、入住配置。拆得越清楚，越不容易一边装一边慌。</p>\n                            <ul>\n                                <li><strong>① 底层硬装预算：</strong> 这是最不能后悔的一部分，包含拆改、水电、防水、瓦工、木工、油工、基础辅材等。它决定的是房子的安全性、耐用性和后期返工成本，优先级永远高于好看的装饰项。</li>\n                                <li><strong>② 功能定制预算：</strong> 包括柜体、门窗、封阳台、厨房、卫浴系统、局部设备等。这部分最容易被“套餐”“升级项”一点点抬高，必须提前设上限，不然会悄悄吞掉大半预算。</li>\n                                <li><strong>③ 家电软装预算：</strong> 包括空调、冰箱、洗衣机、灯具、窗帘、家具、床垫、餐桌椅等。这部分经常被低估，因为很多人前期只盯硬装，等硬装快结束才发现真正让家“能住进去”的支出才刚开始。</li>\n                            </ul>\n                            <div class=\"info-box warning-box\" style=\"margin-top:1rem;\">\n                                <h4>⚠️ 预算最容易失控的 3 种情况</h4>\n                                <ul>\n                                    <li><strong>只做总价，不做分项上限：</strong> 你以为总预算 20 万能控住，但没给柜体、门窗、家电分别设边界，最后每一项都“只多一点”，加起来就超很多。</li>\n                                    <li><strong>把赠品当优惠：</strong> 送家电、送窗帘、送家具，看起来赚了，实际往往是把预算从明处挪到暗处，最后总价并没有更低。</li>\n                                    <li><strong>没留备用金：</strong> 真正稳的预算一定要留出 5%-10% 的机动空间，用来承接合理调整，而不是一有变化就被迫降配。</li>\n                                </ul>\n                            </div>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>📊 装修方式怎么选：别只看“省不省心”，要看你有没有能力接住后果</h4>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>方式</th>\n                                    <th>更适合谁</th>\n                                    <th>优点</th>\n                                    <th>最容易踩的坑</th>\n                                </tr>\n                                <tr>\n                                    <td><strong>自装 / 清包</strong></td>\n                                    <td>时间充足、愿意自己跑材料和盯节点、能扛住沟通成本的人</td>\n                                    <td>材料和施工节奏自己掌控，理论上最容易把钱花到刀刃上</td>\n                                    <td>最怕低估自己的时间和管理成本：前期看似省钱，后期容易因为漏项、协调失序和返工把精力拖垮</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>半包</strong></td>\n                                    <td>想自己把控主材、又不想从零管全部施工的人</td>\n                                    <td>比全包更容易守住材料边界，也比自装更容易推进施工</td>\n                                    <td>最怕“主材和施工责任切不开”：材料晚到、尺寸不对、现场条件变化时，施工方和商家容易互相甩锅</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>全包</strong></td>\n                                    <td>工作忙、想少花精力、接受把一部分选择权交出去的人</td>\n                                    <td>推进效率通常更高，流程衔接和对接成本相对低</td>\n                                    <td>最怕“低开高走”：先用套餐或优惠吸引你签约，后面在主材、升级项、漏项和替换型号上慢慢加钱</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>整装</strong></td>\n                                    <td>想把硬装、定制、部分软装设备一起打包的人</td>\n                                    <td>从展示上看最完整，前期最容易让人产生“拎包入住”的轻松感</td>\n                                    <td>最怕边界模糊：看起来什么都包了，实际上很多关键项目、具体型号、软装档次和交付口径都没写清</td>\n                                </tr>\n                            </table>\n                            <div class=\"info-box warning-box\" style=\"margin-top:1rem;\">\n                                <h4>⚠️ 一个简单判断方法</h4>\n                                <p>如果你现在连<strong>预算上限、主要需求、哪些系统要提前定</strong>都还没想清楚，就不要一上来选最复杂的合作方式。大多数普通业主更该先问自己：<strong>我有多少时间盯工地？我能不能自己判断材料和报价？我更想省钱，还是更想省心？</strong> 这三个问题想清楚了，再选自装、半包、全包还是整装，才不容易后悔。</p>\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"info-box success-box\" style=\"margin-top: 2rem;\">\n                        <h4>🧭 装修前最稳的 5 步准备顺序</h4>\n                        <p style=\"color:var(--text-secondary);font-size:0.9rem;margin:0.75rem 0 1rem;\">很多人准备装修时，第一反应是先去逛材料、看效果图、找公司比价。但真正不容易翻车的顺序，其实是：<strong>先想清楚自己要什么，再看预算能不能承接，最后才进入比公司、比方案、比合同</strong>。顺序一乱，就很容易在“好像都不错”的氛围里被推着交钱。</p>\n                        <div class=\"flow-steps\">\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">1</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">先定居住需求，不要先定风格</div>\n                                    <div class=\"step-desc\">先回答这几个问题：几口人住、要不要儿童房/老人房、收纳需求大不大、有没有宠物、厨房做不做重油烟、阳台是生活阳台还是休闲阳台。需求不清，后面再漂亮的设计也容易变成不好用的家。</div>\n                                </div>\n                            </div>\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">2</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">再定总预算和各项上限</div>\n                                    <div class=\"step-desc\">至少先把硬装、定制、家电软装、备用金四个框定出来。没有上限，就会在每一个局部决策里被“升级一点点”慢慢抬高。</div>\n                                </div>\n                            </div>\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">3</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">然后再去筛装修方式和合作对象</div>\n                                    <div class=\"step-desc\">自装、半包、全包没有绝对好坏，关键看你有没有时间、有没有精力盯工地、能不能自己管材料和节点。先选适合自己的合作方式，再去比具体公司，效率更高。</div>\n                                </div>\n                            </div>\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">4</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">带着问题去谈，而不是带着期待去听</div>\n                                    <div class=\"step-desc\">第一次去装修公司，最怕被“样板间、优惠活动、赠品”带跑。你真正该带过去的是户型图、预算边界、需求优先级、想问清的条款清单。谁能把模糊问题讲清楚，谁才值得继续谈。</div>\n                                </div>\n                            </div>\n                            <div class=\"flow-step\">\n                                <div class=\"step-number\">5</div>\n                                <div class=\"step-content\">\n                                    <div class=\"step-title\">最后才是签约，不要把签约当成开始了解对方</div>\n                                    <div class=\"step-desc\">真正稳的签约，是在你已经看过报价逻辑、确认过材料型号、问过增项边界、谈过付款节奏之后才发生。不要把交定金当成“先占个名额”，那通常是你变被动的起点。</div>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"content-grid\" style=\"margin-top: 2rem;\">\n                        <div class=\"info-box warning-box\">\n                            <h4>🗣️ 第一次去装修公司最该问的 5 个问题</h4>\n                            <ul>\n                                <li><strong>“你这份报价里，哪些是现在没写进去、但后面大概率要做的项目？”</strong> 这句话专门用来抓漏项，比单纯问“会不会增项”更有用。</li>\n                                <li><strong>“材料如果只写品牌，不写型号，后面是谁来决定具体用哪款？”</strong> 这个问题能快速看出对方是不是想给自己留替换空间。</li>\n                                <li><strong>“付款节点具体怎么走？做到哪一步可以付款，哪一步必须验收后付款？”</strong> 先问钱的控制权，才能知道后期会不会被拿捏。</li>\n                                <li><strong>“如果现场尺寸、做法和前期方案不一致，哪些情况算合理调整，哪些情况算你们前期漏算？”</strong> 这句话能提前卡住“现场另算”的弹性空间。</li>\n                                <li><strong>“你们能不能给我一份写清品牌、型号、工艺、施工范围的正式报价，而不是先让我交钱再细化？”</strong> 愿意前置透明的公司，通常比只会催定金的更靠谱。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🔍 比较装修公司和施工队时，不要只比“谁更会说”</h4>\n                            <p style=\"color:var(--text-secondary);font-size:0.9rem;margin-bottom:1rem;\">很多业主第一次接触装修市场，最容易把注意力放在<strong>谁报价更低、谁案例更漂亮、谁态度更热情</strong>上。但真正决定你后面顺不顺的，往往不是“谁今天说得最好听”，而是<strong>谁愿意把施工范围、报价逻辑、材料口径、节点责任讲清楚</strong>。比较对象时，别只看单次聊天体验，要看对方是不是经得起你连续追问。</p>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>比较维度</th>\n                                    <th>你该重点看什么</th>\n                                    <th>危险信号</th>\n                                </tr>\n                                <tr>\n                                    <td>报价透明度</td>\n                                    <td>能不能把施工范围、品牌型号、工艺做法、是否含辅料和升级项写清</td>\n                                    <td>总价看着便宜，但一追问细项就开始含糊其辞</td>\n                                </tr>\n                                <tr>\n                                    <td>沟通方式</td>\n                                    <td>是不是能正面回答问题，而不是一直把你往“先交定金再细聊”上带</td>\n                                    <td>一谈关键条款就转移话题，只强调优惠、活动和名额</td>\n                                </tr>\n                                <tr>\n                                    <td>施工管理</td>\n                                    <td>谁负责现场、谁负责验收、项目经理管几个工地、出了问题谁拍板</td>\n                                    <td>签约前只有销售，签约后现场由谁负责说不清</td>\n                                </tr>\n                                <tr>\n                                    <td>材料口径</td>\n                                    <td>能不能落实到具体系列、型号、等级、配置，而不是只说品牌名</td>\n                                    <td>只会说“都是正品”“都是大牌”，但不愿写进报价和合同</td>\n                                </tr>\n                                <tr>\n                                    <td>边界意识</td>\n                                    <td>对增项、漏项、延期、返工、换货有没有明确规则</td>\n                                    <td>承诺很多，但一问责任边界就说“到时候现场再看”</td>\n                                </tr>\n                            </table>\n                            <div class=\"info-box success-box\" style=\"margin-top:1rem;\">\n                                <h4>✅ 一个实用做法</h4>\n                                <p>至少找 <strong>2~3 家</strong> 用<strong>同一份需求清单、同一套户型图、同样的问题</strong>去谈。这样你比的才是对方的真实能力，而不是谁碰巧更会带节奏。</p>\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"content-grid\" style=\"margin-top: 2rem;\">\n                        <div class=\"info-box\">\n                            <h4>🧾 哪些钱必须前置想清楚，哪些可以后期再买</h4>\n                            <p style=\"color:var(--text-secondary);font-size:0.9rem;margin-bottom:1rem;\">装修里最容易焦虑的一个点，是觉得所有东西都得一次性定完。其实不是。真正该前置想清楚的，是那些会影响<strong>水电点位、空间尺寸、施工做法、后期返工成本</strong>的项目；而很多软装和非结构性消费，完全可以后移决策。</p>\n                            <ul>\n                                <li><strong>必须前置想清楚的：</strong> 空调/新风/地暖要不要装，厨房电器和卫浴系统的大方向，柜体布局，封窗方案，插座和灯位需求，洗衣烘干位置，是否做智能马桶/洗碗机/净水等。这些都会反向影响水电、尺寸预留和施工顺序。</li>\n                                <li><strong>可以后期再买的：</strong> 沙发、茶几、餐椅、装饰灯、挂画、边几、小家电、部分窗帘、装饰摆件等。这些更多是体验层升级，不值得在前期最紧张的时候挤占关键预算。</li>\n                                <li><strong>最容易判断错的一类：</strong> 柜体拉手、龙头花洒、部分灯具、五金配件这类“看着不贵”的项目。它们单项不一定很大，但数量一多、升级一点就容易把预算吃掉，最好提前设档次边界。</li>\n                            </ul>\n                            <div class=\"info-box success-box\" style=\"margin-top:1rem;\">\n                                <h4>✅ 一个实用判断标准</h4>\n                                <p>凡是<strong>现在不定，后面会影响开槽、布线、开孔、尺寸预留、基层施工</strong>的，尽量前置；凡是后面换了也不影响主体施工的，可以后置。这样你就不会在装修前期被迫同时做太多决定。</p>\n                            </div>\n                        </div>\n                        <div class=\"info-box warning-box\">\n                            <h4>📋 正式开工前，最后再核对一次这 6 件事</h4>\n                            <ul>\n                                <li><strong>需求有没有定住：</strong> 哪些空间怎么用、哪些设备要装、哪些东西必须保留，至少要形成一版稳定结论。</li>\n                                <li><strong>预算边界有没有写清：</strong> 不只是记在脑子里，而是对硬装、定制、设备、软装分别有上限。</li>\n                                <li><strong>报价和合同附件齐不齐：</strong> 报价单、材料表、工艺说明、点位图、付款节点，缺一项后面都容易吵。</li>\n                                <li><strong>开工后谁负责现场：</strong> 销售、设计、项目经理、工长分别管什么，必须在开工前说清楚。</li>\n                                <li><strong>哪些材料和设备必须先定：</strong> 尤其会影响水电点位、吊顶、尺寸预留的项目，别等现场催了才决定。</li>\n                                <li><strong>留证方式有没有约好：</strong> 关键节点谁拍照、怎么验收、谁签字，最好在开工前就说好，不要等出问题才补。</li>\n                            </ul>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">很多翻车不是因为业主一点都不懂，而是因为<strong>开工前最后这一轮核对没有做完整</strong>：前面都聊过，但没有真正落成一份可执行的共识。开工前把这 6 件事再过一遍，能挡掉很多后面本来可以避免的争议。</p>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:0.8rem;\">如果你现在最拿不准的是<strong>中央空调、地暖、新风、进水系统</strong>到底该什么时候定、会影响哪些工种，建议继续看：<a href=\"equipment-systems.html\">设备系统前置决策专题</a>。</p>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:0.8rem;\">如果你卡在<strong>插座、灯位、给排水、洗碗机/净水/智能马桶这些点位到底该怎么前置想清楚</strong>，建议连着看：<a href=\"wiring-and-points.html\">水电点位前置规划专题</a>。那一页更适合把“最晚什么时候定、各空间最容易漏什么、点位图至少写到什么程度”一次理顺。</p>\n                        </div>\n                    </div>"
 },

  "summary": "装修材料里，最容易让业主后悔的通常不是单价本身，而是 预算分配失衡、被宣传词带偏、和自己的生活方式不匹配 。比如小户型盲目上水地暖，后期维护和初装成本都不轻；预算紧却在柜体花很多钱、五金和环保反而没盯；封窗只看型材品牌，却忽视玻璃、五金和安装。材料选购这一章最重要的不是追求“最贵最好”，而是知道： 哪些钱值得花，哪些卖点只是话术，哪些配置。",
