  "body": "<div class=\"tip-box\">\n                        <h4>💡 油工决定你家\"颜值\"，也是最容易被糊弄的</h4>\n                        <p>油工是最容易让人“看着差不多”的工种，但也是最容易在入住后天天面对的问题：波浪纹、开裂、阴影、色差、返碱、掉粉、墙顶交接不顺，全都会直接影响观感。很多人以为油工只是“刷一层漆”，其实它真正决定成败的是基层处理。你在这一章最该记住的不是某个漆的广告词，而是三件事：<strong>基层是否稳定、找平是否到位、灯光下是否经得起看</strong>。油工一旦偷工减料，后面再贵的乳胶漆也只是把问题盖薄一点。</p>\n                    </div>\n                    <div class=\"content-grid\">\n                        <div class=\"info-box success-box\">\n                            <h4>🎨 油工标准流程（重点不是“刷了几遍”，而是每一步是否做到位）</h4>\n                            <div class=\"flow-steps\">\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">1</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">基层检查与问题排查</div>\n                                        <div class=\"step-desc\">正式做油工前，先看原墙面是否起砂、空鼓、开裂、返碱，石膏板接缝和线槽修补是否已经处理。油工最怕“带病施工”，因为前面的木工、水电、抹灰问题，最后都会在这一步被放大出来。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">2</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">界面处理与基层加固</div>\n                                        <div class=\"step-desc\">墙固、界面剂不是“刷了就高级”，而是为了增强附着力、统一基层状态。真正要注意的是：是否需要刷、刷在什么基层、是不是全屋乱刷。很多工地把这一步做成营销动作，却忽略了基层本身问题还没解决。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">3</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">石膏修补与找平</div>\n                                        <div class=\"step-desc\">线槽、裂缝、新旧墙交接、石膏板接缝这些地方，要先用合适材料修补、挂网、找平，而不是直接上腻子硬遮。很多后期开裂、墙面阴影，其实不是漆的问题，而是这一层找平和修补没做好。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">4</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">多遍腻子与阴干</div>\n                                        <div class=\"step-desc\">腻子不是越厚越好，也不是赶着一天全做完。关键是薄批多遍、充分阴干、控制总厚度，并且每一遍都为下一遍服务。最怕的是为了赶工，上一遍没干透就继续刮，后面空鼓、开裂、掉粉都会陆续冒出来。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">5</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">打磨与灯光复查</div>\n                                        <div class=\"step-desc\">很多墙面白天看着没事，一开射灯、线性灯、筒灯就全暴露。打磨阶段一定要在不同角度、不同光线下检查，尤其电视墙、沙发背景墙、走廊端景、卧室床头这些会被光扫到的位置，最容易出现波浪纹和高低差。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">6</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">底漆面漆与成品保护</div>\n                                        <div class=\"step-desc\">底漆的作用不是“多卖你一桶漆”，而是封闭基层、提升附着和减少色差；面漆决定最终观感。刷完后还要保护墙角、门套、开关位和地面，不然后续安装一进场，边角磕碰和污染会让前面的细活全打折。</div>\n                                    </div>\n                                </div>\n                            </div>\n                        </div>\n                        <div class=\"info-box warning-box\">\n                            <h4>⚠️ 油工避坑要点（按“坑在哪 / 怎么查 / 怎么应对”展开）</h4>\n                            <ul>\n                                <li><strong>南方潮湿地区省掉底漆：</strong> 有些工地为了压缩预算，会把底漆说成“可刷可不刷”。但在潮湿环境里，底漆对封闭基层、减少返碱和发霉风险很重要。你不要只听“我们经验丰富”，而要问清楚：墙面当前基层状态是什么、为什么可以省、谁承担后果。</li>\n                                <li><strong>腻子粉乱加胶水，表面更硬、空气更差：</strong> 一些师傅会觉得“加胶更牢”，但家装里乱加胶经常意味着甲醛和后期环保风险上升。你不一定要自己懂所有化学成分，但至少要知道：规范材料本身应能满足施工要求，不应该靠现场随意加料来“补强”。</li>\n                                <li><strong>有射灯的墙面按普通墙面处理：</strong> 很多波浪纹不是肉眼看不见，而是白天不明显、晚上开灯全出来。凡是以后会被斜光、侧光、射灯打到的墙面，都应该在施工时单独提高找平和打磨标准，而不是按普通卧室白墙一样糊弄过去。</li>\n                                <li><strong>柜体靠墙区域不冲筋找平，最后留缝难看：</strong> 衣柜、玄关柜、浴室柜这些地方，如果墙面本身歪斜，后面安装就容易出现缝大、缝小、不贴墙的问题，商家还常把责任甩给土建或油工。正确做法是在木作/柜体安装前，把相关区域提前按安装要求校平，而不是最后靠打胶遮丑。</li>\n                                <li><strong>只追求“喷涂效率”，不看修补难度：</strong> 喷涂确实快，但不是所有位置都适合，也不是一喷就一定高级。后期如果需要局部修补、补漆、改色，喷涂面往往更难做到完全无痕。要不要喷、喷哪些区域、后期维修怎么处理，最好提前和施工方说清楚。</li>\n                            </ul>\n                            <div class=\"info-box\" style=\"margin-top:1rem;\">\n                                <h4>🧾 油工开工前，这 6 项基层状态最好先验一遍</h4>\n                                <ul>\n                                    <li><strong>空鼓和起砂：</strong> 先确认原墙有没有“带病基层”，否则后面材料附着再好也扛不住。</li>\n                                    <li><strong>返碱和潮气：</strong> 墙面是否干透、是否存在渗水、返碱、水印，先排查再开工。</li>\n                                    <li><strong>线槽修补位：</strong> 修补是否已经完成、材料是否匹配，不能直接等腻子来兜底。</li>\n                                    <li><strong>石膏板缝和新旧墙交接：</strong> 这些地方是否已经明确专项防裂做法。</li>\n                                    <li><strong>重点观感面：</strong> 哪些墙以后会被射灯、线性灯、侧光扫到，要先单独标出来。</li>\n                                    <li><strong>柜体和门套交接区：</strong> 是否已经按安装面要求确认平整度，不要等定制进场后才发现问题。</li>\n                                </ul>\n                            </div>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>📏 油工验收时，最容易翻车的 5 个观察点</h4>\n                            <ul>\n                                <li><strong>平整度：</strong> 不要只正面看，要贴着墙侧看、开灯看、用靠尺看，波浪纹最怕在强光下暴露。</li>\n                                <li><strong>阴阳角顺直度：</strong> 墙角、顶角、门洞最容易歪，尤其长走廊和大白墙，一旦不直特别明显。</li>\n                                <li><strong>色差与补丁感：</strong> 同一面墙不同区域颜色、光泽不一致，通常说明施工遍数、干燥条件或补刷方式有问题。</li>\n                                <li><strong>裂缝与修补痕：</strong> 石膏板缝、线槽修补位、新旧墙交接处，是最值得重点盯的地方。</li>\n                                <li><strong>柜体/踢脚线/门套交接：</strong> 这些位置最能看出油工是不是细活，很多“总体还行”的项目，问题都出在这些边口上。</li>\n                            </ul>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">验收油工时，建议白天和晚上都看一遍；白天看整体，晚上开主灯、射灯、筒灯看细节。很多墙面问题在自然光下不明显，在人造光下却非常扎眼。</p>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🧭 冲筋找平 vs 顺平，不是谁更高级，而是谁更适合你家</h4>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>处理方式</th>\n                                    <th>更适合的场景</th>\n                                    <th>优势</th>\n                                    <th>代价与边界</th>\n                                </tr>\n                                <tr>\n                                    <td>冲筋找平</td>\n                                    <td>无主灯、长墙面、对柜体贴墙和垂平要求高的区域</td>\n                                    <td>更容易把墙面、地面、顶面关系做得更方正，后期灯光和柜体观感更稳定</td>\n                                    <td>造价更高、施工更细，厚度处理不当也会带来开裂风险</td>\n                                </tr>\n                                <tr>\n                                    <td>顺平工艺</td>\n                                    <td>普通居住空间、多数常规墙面处理</td>\n                                    <td>施工更普遍、成本更可控，能满足大多数家庭基础观感需求</td>\n                                    <td>能把面顺平，但不等于把墙真正做方正；对高要求灯光和柜体贴墙效果有限</td>\n                                </tr>\n                            </table>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">最实用的思路不是“全屋都做最高级”，而是<strong>把重点观感面、柜体靠墙面、无主灯区域优先处理好</strong>。全屋一刀切既花钱，也未必必要。</p>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🧱 线槽回填、石膏、腻子，这些材料边界一混，后面就容易开裂</h4>\n                            <ul>\n                                <li><strong>线槽和修补位，优先考虑适配的石膏体系：</strong> 不是所有位置都适合用水泥砂浆硬填，尤其墙面线槽，后期收缩刚裂很常见。</li>\n                                <li><strong>腻子不是拿来“厚找平”的：</strong> 真正的大误差靠基层找平和石膏处理，腻子更适合做面层精细找平，太厚就容易脱层、空鼓、起裂。</li>\n                                <li><strong>石膏板接缝和新旧墙交接要专项防裂：</strong> 这些地方最容易被一句“后面腻子能盖住”带过，实际上恰恰最该单独处理。</li>\n                                <li><strong>不是所有墙都需要全屋挂网：</strong> 有明显裂缝、新旧墙交接、特殊基层，才更值得重点做；把“全屋挂网”当万金油，经常只是营销话术。</li>\n                            </ul>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">油工最怕的不是某一遍漆少刷一遍，而是<strong>基层材料各干各的、边界混乱</strong>。前面材料逻辑一乱，后面所有观感问题都会集中爆出来。</p>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>💨 阴干、打磨、开灯验墙，这三步比“刷了几遍”更影响最终效果</h4>\n                            <ul>\n                                <li><strong>别把快速干透当成施工效率：</strong> 腻子和基层没有充分阴干，就急着下一遍，后面起鼓、开裂、掉粉概率会明显增加。</li>\n                                <li><strong>打磨不是越猛越好：</strong> 重点是等干透以后细打磨，而不是靠粗暴打磨掩盖前面找平没做好。</li>\n                                <li><strong>验墙一定要开灯、侧看、近看：</strong> 很多墙面白天自然光下看着正常，一到筒灯、射灯、线性灯下就全暴露。</li>\n                                <li><strong>重点墙面要单独提高标准：</strong> 电视墙、沙发墙、床头背景、走廊端景、无主灯扫光面，这些都不应该按普通白墙一个标准糊弄过去。</li>\n                            </ul>\n                            <div class=\"info-box warning-box\" style=\"margin-top:1rem;\">\n                                <h4>🔁 油工返修最容易扯皮的，不是重刷，而是“到底算谁的问题”</h4>\n                                <ul>\n                                    <li><strong>先分清基层问题还是面层问题：</strong> 如果是木工缝、线槽修补、新旧墙交接本身没处理好，就不能简单把责任全推给最后一遍漆。</li>\n                                    <li><strong>灯光下波浪纹要提前约定验收条件：</strong> 如果后面开灯才发现观感差，施工方很容易说“白天看没问题”。</li>\n                                    <li><strong>补漆和整面重做不是一回事：</strong> 局部补刷可能留下光泽差、补丁感，重点墙面往往要按整面处理才更稳妥。</li>\n                                    <li><strong>返修后是否影响柜体、踢脚线、门套安装：</strong> 这些连带问题要提前说清，不然又会变成安装方和油工互相甩锅。</li>\n                                </ul>\n                            </div>\n                            <div class=\"info-box\" style=\"margin-top:1rem;\">\n                                <h4>🛡️ 油工完工后，最容易被后续工种破坏的 4 类位置</h4>\n                                <ul>\n                                    <li><strong>墙角和门洞边：</strong> 五金、门套、家具进场时最容易磕碰掉角。</li>\n                                    <li><strong>开关插座和灯位周边：</strong> 安装面板、灯具、调试时很容易留下黑印、压痕和小崩边。</li>\n                                    <li><strong>柜体靠墙面：</strong> 定制安装时一旦墙面不平或保护不到位，最容易留下划痕和补漆痕。</li>\n                                    <li><strong>踢脚线、地面与墙面交接：</strong> 清理、搬运、安装收口时经常把最下口蹭脏或碰坏。</li>\n                                </ul>\n                            </div>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🔍 业主在油工阶段最该追问的 8 个问题</h4>\n                            <ul>\n                                <li><strong>“哪些墙面属于重点观感面，今天有没有按更高标准处理？”</strong> 让施工方主动指出重点区域，而不是后面你自己发现。</li>\n                                <li><strong>“线槽、新旧墙、石膏板缝这些地方具体怎么防裂？”</strong> 这类回答最能看出师傅是不是只会“刷墙”。</li>\n                                <li><strong>“这面墙适合做冲筋找平，还是顺平就够了？”</strong> 用这句逼对方说清楚工艺边界，而不是只推更贵方案。</li>\n                                <li><strong>“线槽回填和基层找平今天分别用了什么材料？”</strong> 这句专门防止石膏、水泥、腻子乱混着用。</li>\n                                <li><strong>“底漆为什么这样安排？哪些地方必须刷？”</strong> 让对方给出基于基层情况的解释，而不是套模板回答。</li>\n                                <li><strong>“柜子、门套、踢脚线交接区域现在够平吗？”</strong> 这是后面最容易互相甩锅的位置，提前问最值。</li>\n                                <li><strong>“我们准备什么时候在开灯和侧光条件下验一遍墙面？”</strong> 不要等全做完才发现波浪纹。</li>\n                                <li><strong>“如果后面开灯发现波浪纹或补丁感，按谁的问题返工？”</strong> 责任边界越早说清楚，后面越不容易扯皮。</li>\n                            </ul>\n                        </div>\n                    </div>"
 },

  "body": "<div class=\"tip-box\">\n                        <h4>💡 国标不是拿来背的，是拿来验收、追责、少吃亏的</h4>\n                        <p>很多业主收藏一堆标准号，真正出问题时却不知道怎么用。其实国标、行标、验收规范最大的价值，不是让你和工长比谁更专业，而是帮你把“我感觉不对”变成“这里不符合约定或通行标准”。你在第17章最该学会的，不是记住全部编号，而是知道<strong>遇到什么问题，对应查哪类标准、怎么固定证据、怎么把责任说清楚</strong>。施工竣工阶段最怕两件事：一是问题存在但没拍证据，二是双方口头扯皮却没有书面依据。</p>\n                    </div>\n                    <div class=\"content-grid\">\n                        <div class=\"info-box success-box\">\n                            <h4>📐 竣工验收时，标准应该怎么用</h4>\n                            <div class=\"flow-steps\">\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">1</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">先按工种分问题，不要一上来只问“合不合格”</div>\n                                        <div class=\"step-desc\">空鼓、开裂、渗水、阴阳角不直、门窗收口、开关插座问题，分别对应不同工种和不同验收逻辑。你先把问题归类，后面才能知道该找施工规范、材料标准还是环保标准，而不是一股脑全算在“装修公司不靠谱”上。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">2</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">把“感觉”变成“位置 + 现象 + 证据”</div>\n                                        <div class=\"step-desc\">例如不要只说“这面墙不平”，而要写成“主卧床头背景墙右侧，开射灯后可见连续波浪纹，2米靠尺下有明显缝隙”。有位置、有现象、有照片或视频，后面才有追责基础。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">3</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">再去找对应标准或合同约定</div>\n                                        <div class=\"step-desc\">不是所有问题都要你精确背出完整标准号，但你至少要能说明：这是施工质量问题、材料环保问题，还是合同约定未兑现。装修维权里，合同约定 + 现场证据 + 通行标准，通常比单独甩一个标准号更有用。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">4</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">要求施工方明确整改方案和责任边界</div>\n                                        <div class=\"step-desc\">发现问题后不要只听“后面给你处理”“这个正常”。你要追问：谁整改、什么时候整改、返工是否影响已完工项目、费用谁承担、如果再次不达标怎么办。很多扯皮不是因为问题复杂，而是当时没把责任说死。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">5</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">环保问题单独看，不要和施工观感混在一起</div>\n                                        <div class=\"step-desc\">墙面平不平、瓷砖空不空鼓，和甲醛、VOC、苯系物是否超标，不是同一类问题。环保争议最好用材料环保标准、检测报告和检测条件说话，而不是拿“闻起来没味道”当依据。</div>\n                                    </div>\n                                </div>\n                            </div>\n                        </div>\n                        <div class=\"info-box warning-box\">\n                            <h4>⚠️ 最常见的 5 种“有标准也维不了权”的翻车点</h4>\n                            <ul>\n                                <li><strong>只截图标准，不保留现场证据：</strong> 没有位置照片、近景细节、整体环境和时间记录，后面很容易变成各说各话。</li>\n                                <li><strong>问题发现太晚：</strong> 比如美缝后才查空鼓、装柜后才说墙不平、入住很久后才追问用料，这时返工边界已经非常难划清。</li>\n                                <li><strong>合同没写清验收口径：</strong> 如果合同里只有“按国家标准施工”几个字，后面很多细节仍然会扯。更好的做法是把关键节点、品牌、工艺、返工责任写具体。</li>\n                                <li><strong>把营销话术当标准：</strong> 像“欧标工艺”“德系施工”“老师傅都这么做”，这些都不是验收依据。真出问题时，能落地的还是合同、照片、记录、检测和通行规范。</li>\n                                <li><strong>环保检测不看前提条件：</strong> 通风多久、是否封闭、检测时温湿度如何、抽检点位怎么选，这些都会影响结果。报告不是有就行，还要看是不是按合适条件测的。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🧾 业主最值得收藏的几类标准（重点是知道“什么时候用”）</h4>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>场景</th>\n                                    <th>常见标准/依据</th>\n                                    <th>你该怎么用</th>\n                                </tr>\n                                <tr>\n                                    <td>墙地面、空鼓、平整度、阴阳角</td>\n                                    <td>住宅装修施工及验收相关规范、地方家装验收标准、合同工艺约定</td>\n                                    <td>用于判断是不是施工质量问题，重点结合靠尺、空鼓锤、现场照片一起使用</td>\n                                </tr>\n                                <tr>\n                                    <td>防水、闭水、渗漏</td>\n                                    <td>防水施工规范、闭水试验记录、交付验收记录</td>\n                                    <td>用于判断是否按流程做过试验，以及渗漏责任归属是否明确</td>\n                                </tr>\n                                <tr>\n                                    <td>电路、插座、回路、安全</td>\n                                    <td>电气安装相关规范、合同点位图、回路清单</td>\n                                    <td>用于核对是否按图施工、是否存在安全隐患，不要只看“通电了没有”</td>\n                                </tr>\n                                <tr>\n                                    <td>板材、定制、木作环保</td>\n                                    <td>GB/T 39600-2021 等人造板甲醛释放量标准</td>\n                                    <td>用于核对材料等级、商家宣传是否属实，保留板件标签、订单和检测资料</td>\n                                </tr>\n                                <tr>\n                                    <td>乳胶漆、胶粘剂、涂料环保</td>\n                                    <td>GB 18582-2020、GB 18583-2008、GB 18581-2020 等</td>\n                                    <td>用于判断材料本身的有害物质限量，不等于你家空气一定合格，但它决定了源头风险</td>\n                                </tr>\n                                <tr>\n                                    <td>整屋空气检测</td>\n                                    <td>室内空气质量相关标准、第三方检测报告</td>\n                                    <td>用于判断入住前空气是否达标，重点看检测条件、检测机构和采样方式</td>\n                                </tr>\n                            </table>\n                            <div class=\"info-box warning-box\" style=\"margin-top:1rem;\">\n                                <h4>📦 验收不是只看“完工那一天”：材料、隐蔽、竣工要分三次看</h4>\n                                <table class=\"material-table\">\n                                    <tr>\n                                        <th>验收阶段</th>\n                                        <th>你重点该看什么</th>\n                                        <th>为什么不能拖到最后一起看</th>\n                                    </tr>\n                                    <tr>\n                                        <td>材料验收</td>\n                                        <td>品牌、型号、批次、外包装、到场数量、是否与合同和报价一致</td>\n                                        <td>材料一旦被拆包、裁切、铺贴或安装，后面就很难再证明“到场时不是这一款”</td>\n                                    </tr>\n                                    <tr>\n                                        <td>隐蔽工程验收</td>\n                                        <td>水电走向、防水闭水、回填、封板前节点、关键尺寸和留孔预留</td>\n                                        <td>隐蔽项目一旦被覆盖，很多问题就只能靠回忆和扯皮，返工代价也会更高</td>\n                                    </tr>\n                                    <tr>\n                                        <td>竣工验收</td>\n                                        <td>观感、功能、成品保护、安装交接、问题清单、尾款条件</td>\n                                        <td>这是最后一次系统性把问题和责任写进清单的机会，不能只看“差不多能用”</td>\n                                    </tr>\n                                </table>\n                            </div>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🌿 环保国标汇总（别只看编号，要知道它管的是“材料”还是“空气”）</h4>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>材料类型</th>\n                                    <th>标准号</th>\n                                    <th>重点理解</th>\n                                </tr>\n                                <tr>\n                                    <td>人造板甲醛释放量</td>\n                                    <td>GB/T 39600-2021</td>\n                                    <td>主要看板材本身环保等级，适合用于定制柜、木作板材、商家宣传核验</td>\n                                </tr>\n                                <tr>\n                                    <td>壁纸有害物质限量</td>\n                                    <td>GB 18585-2023</td>\n                                    <td>用于判断壁纸等墙面装饰材料本身的有害物质控制情况</td>\n                                </tr>\n                                <tr>\n                                    <td>胶粘剂有害物质限量</td>\n                                    <td>GB 18583-2008</td>\n                                    <td>适用于玻璃胶、结构胶、贴皮胶等辅料，很多异味和环保争议都来自这些“看不见的配角”</td>\n                                </tr>\n                                <tr>\n                                    <td>乳胶漆有害物质限量</td>\n                                    <td>GB 18582-2020</td>\n                                    <td>判断乳胶漆材料本身环保性的重要依据，但“没味道”不等于一定更环保</td>\n                                </tr>\n                                <tr>\n                                    <td>木器涂料有害物质限量</td>\n                                    <td>GB 18581-2020</td>\n                                    <td>适用于木门、木饰面、家具涂装等场景，尤其适合关注定制喷漆件</td>\n                                </tr>\n                                <tr>\n                                    <td>全屋定制/板式制品宣传核验</td>\n                                    <td>常结合 GB/T 39600-2021 与品牌送检资料</td>\n                                    <td>别只听“ENF 级”“母婴级”，要让商家把板材来源、等级、检测资料对应到你下单的具体产品</td>\n                                </tr>\n                            </table>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🧪 材料环保、宣传环保、空气检测，这 3 件事一定要分开看</h4>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>常见说法</th>\n                                    <th>它真正指向什么</th>\n                                    <th>你该怎么核实</th>\n                                </tr>\n                                <tr>\n                                    <td>“我们板材是 ENF / E0 / 无醛添加”</td>\n                                    <td>通常是板材或基材本身的环保等级口径</td>\n                                    <td>要求对应到你订单里的具体板材来源、系列、等级和检测资料</td>\n                                </tr>\n                                <tr>\n                                    <td>“我们家用的都是环保胶、环保漆”</td>\n                                    <td>通常是辅材自身的有害物质限量控制</td>\n                                    <td>重点问执行标准、型号和实际到场材料，不要只听口头描述</td>\n                                </tr>\n                                <tr>\n                                    <td>“你家做完环保肯定没问题”</td>\n                                    <td>这是对整屋空气结果的暗示，不等于材料资料本身已经充分</td>\n                                    <td>入住前仍要看通风、封闭条件、检测机构和采样方式，别把材料资料当空气结论</td>\n                                </tr>\n                            </table>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">装修环保最容易被混淆的，就是把<strong>材料单项合格</strong>说成<strong>整屋空气一定合格</strong>，或者反过来拿“闻起来没味道”去代替材料资料。你要把这两个层面拆开，才不容易被话术带偏。</p>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>📁 真到验收和维权时，最有用的不是一句“按国标”，而是一套证据包</h4>\n                            <ul>\n                                <li><strong>合同和附件：</strong> 把品牌、型号、工艺、环保承诺、验收口径、付款节点固定住。</li>\n                                <li><strong>到场材料照片：</strong> 尤其是板材标签、油漆桶身、胶粘剂包装、窗户配置单、五金外箱这些最容易后期说不清的东西。</li>\n                                <li><strong>关键节点记录：</strong> 像闭水试验、水电定位、封板前、铺贴前、安装前后，最好留时间和位置证据。</li>\n                                <li><strong>检测与送检资料：</strong> 真涉及环保或材料争议时，优先保留能对应到产品型号和施工现场的资料，而不是泛泛宣传页。</li>\n                                <li><strong>问题清单：</strong> 每个问题都尽量写成“位置 + 现象 + 对应依据 + 整改要求”，不要只说“这不对”。</li>\n                            </ul>\n                            <div class=\"info-box success-box\" style=\"margin-top:1rem;\">\n                                <h4>📸 留证据不是多拍几张图，而是拍对 4 类内容</h4>\n                                <table class=\"material-table\">\n                                    <tr>\n                                        <th>证据类型</th>\n                                        <th>怎么拍 / 怎么留</th>\n                                        <th>作用</th>\n                                    </tr>\n                                    <tr>\n                                        <td>整体位置图</td>\n                                        <td>先拍空间全景，再拍问题点所在墙面/区域，最好能让人一眼看出位置</td>\n                                        <td>防止后面只剩局部特写，别人根本不知道问题到底在哪</td>\n                                    </tr>\n                                    <tr>\n                                        <td>近景细节图</td>\n                                        <td>拍清空鼓、裂缝、渗水、标签、型号、包装、接口、收口等关键细节</td>\n                                        <td>用来证明问题现象本身，或证明材料与约定不一致</td>\n                                    </tr>\n                                    <tr>\n                                        <td>时间与节点记录</td>\n                                        <td>在关键施工节点留照片/视频/聊天记录，必要时配上日期、施工阶段和说明</td>\n                                        <td>帮助还原“问题是在什么时候出现、有没有在覆盖前被确认”</td>\n                                    </tr>\n                                    <tr>\n                                        <td>书面确认材料</td>\n                                        <td>保留验收单、整改清单、签字页、聊天确认、送货单、检测报告</td>\n                                        <td>让证据链从“我拍到了”升级成“双方都确认过”</td>\n                                    </tr>\n                                </table>\n                            </div>\n                            <div class=\"info-box warning-box\" style=\"margin-top:1rem;\">\n                                <h4>⚠️ 最容易让证据失效的 4 种情况</h4>\n                                <ul>\n                                    <li><strong>只拍细节不拍位置：</strong> 后面别人可以直接说“这不是你家”或“无法判断在哪个区域”。</li>\n                                    <li><strong>材料到场时没拍标签：</strong> 等安装完再追型号，很多包装和批次信息已经不见了。</li>\n                                    <li><strong>隐蔽项目没在覆盖前留记录：</strong> 封板、回填、贴砖后再说前面有问题，证明难度会大很多。</li>\n                                    <li><strong>只有口头说法，没有书面确认：</strong> 真到争议阶段，聊天、签字单、整改清单往往比口头承诺更有用。</li>\n                                </ul>\n                            </div>\n                            <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">真正能帮你减少吃亏的，不是背下更多标准号，而是把<strong>合同约定、现场证据、材料资料、检测依据</strong>这四类东西串起来。少任何一环，后面都容易被对方钻空子。</p>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🔍 业主在竣工验收和环保阶段最该追问的 8 个问题</h4>\n                            <ul>\n                                <li><strong>“这个问题对应的是哪一项工艺约定、验收标准，还是合同承诺？”</strong> 先逼对方把依据说清楚。</li>\n                                <li><strong>“整改后我怎么复核？复核标准是什么？”</strong> 不然很容易从第一次扯皮拖到第二次。</li>\n                                <li><strong>“如果返工影响到相邻成品，责任和费用怎么算？”</strong> 这类边界问题一定要提前问。</li>\n                                <li><strong>“环保说达标，依据是材料达标还是空气检测达标？”</strong> 这两个概念经常被故意混用。</li>\n                                <li><strong>“你现在给我的这份环保资料，能不能对应到我家实际使用的型号和批次？”</strong> 防止拿宣传资料顶替交付资料。</li>\n                                <li><strong>“检测报告对应的点位、时间、封闭条件、机构资质是什么？”</strong> 只有报告结论，没有检测条件，可信度很有限。</li>\n                                <li><strong>“如果材料宣传和到场材料不一致，你们按什么规则承担责任？”</strong> 这句专门卡材料替换和模糊交付。</li>\n                                <li><strong>“我现在应该保留哪些照片、标签、外箱和单据，后面最有用？”</strong> 这句能把很多未来的证据链提前补齐。</li>\n                            </ul>\n                        </div>\n                    </div>"
 },

  "body": "<div class=\"tip-box\">\n                        <h4>💡 设计资源真正的价值，不是“看得多”，而是“看得准”</h4>\n                        <p>很多人装修前刷了几百张图，最后还是装得不满意，不是因为图看少了，而是因为<strong>没有分清“我真想要什么”与“这张图只是拍得好看”</strong>。对普通业主来说，设计资源这一章最重要的作用不是让你记住多少网站，而是帮助你建立一个筛选机制：哪些图适合拿来表达风格，哪些图只能看看气氛，哪些图一照搬就容易翻车。灵感收集如果没有方法，最后往往会变成一堆互相打架的截图。</p>\n                    </div>\n                    <div class=\"content-grid\">\n                        <div class=\"info-box success-box\">\n                            <h4>🧭 普通业主找设计灵感，最实用的 5 步方法</h4>\n                            <div class=\"flow-steps\">\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">1</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">先找“生活方式”，再找“装修风格”</div>\n                                        <div class=\"step-desc\">不要一上来就说想要奶油风、极简风、侘寂风，而要先想清楚：你家常住几个人、收纳需求多不多、是否常做饭、是否要老人小孩共住、是否需要办公区。真正决定设计的，往往不是风格名词，而是你的生活方式。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">2</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">把喜欢的图分成“氛围图”和“落地图”</div>\n                                        <div class=\"step-desc\">氛围图适合表达你喜欢的颜色、材质、光感、整体气质；落地图则要看户型、尺寸、预算、施工难度是否接近你家。很多人最大的误区，就是把摄影棚级别的氛围图当成自己家能直接照搬的施工图。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">3</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">每张图都问自己“我到底喜欢它哪里”</div>\n                                        <div class=\"step-desc\">是喜欢这张图的木色、灯光、收纳方式、空间留白，还是只是被滤镜和广角镜头骗到了？如果说不出喜欢点，后面和设计师沟通时就容易变成“我就想要这种感觉”，最终谁也说不清问题出在哪。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">4</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">整理成少量、高质量的参考集</div>\n                                        <div class=\"step-desc\">不要丢给设计师 200 张图，而要筛成 10-20 张，并标注“喜欢什么、不喜欢什么、哪些不能接受”。好的参考图集不是数量多，而是方向统一、信息明确，能让设计师快速抓住你的真实偏好。</div>\n                                    </div>\n                                </div>\n                                <div class=\"flow-step\">\n                                    <div class=\"step-number\">5</div>\n                                    <div class=\"step-content\">\n                                        <div class=\"step-title\">把灵感翻译成可执行要求</div>\n                                        <div class=\"step-desc\">例如不要只说“想要高级感”，而要翻译成“全屋暖灰木色、不做复杂造型、客厅无主灯、柜门尽量平整、厨房更重视收纳和清洁方便”。能落地的表达，远比抽象审美词更有用。</div>\n                                    </div>\n                                </div>\n                            </div>\n                        </div>\n                        <div class=\"info-box warning-box\">\n                            <h4>⚠️ 最容易把业主带偏的 5 类效果图</h4>\n                            <ul>\n                                <li><strong>超大横厅、超高层高、超大采光面的样板图：</strong> 这些图的空间基础和普通住宅根本不是一回事，直接照搬往往会翻车。</li>\n                                <li><strong>广角镜头拍出来的“通透感”：</strong> 现场实际空间往往比照片里小很多，别把摄影效果误认为真实尺度。</li>\n                                <li><strong>重度滤镜和后期调色图：</strong> 你喜欢的可能不是材料本身，而是后期色调，落地后颜色常常完全不是一回事。</li>\n                                <li><strong>只拍局部、避开收纳和生活痕迹的图：</strong> 很多图只适合欣赏，不适合真实居住，尤其不适合有孩子、老人、强收纳需求的家庭。</li>\n                                <li><strong>复杂灯光、悬空结构、异形造型很多的图：</strong> 这类图不仅贵，而且对施工、维护、清洁要求都高，普通家庭要先问预算和后期打理能不能接受。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🌐 设计资源怎么用，比网站名单本身更重要</h4>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>网站名称</th>\n                                    <th>网址</th>\n                                    <th>更适合拿来做什么</th>\n                                </tr>\n                                <tr>\n                                    <td><strong>设计本</strong></td>\n                                    <td>shejiben.com</td>\n                                    <td>适合看大量家装案例和设计师作品，但要注意区分效果图与实景图</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>拓者设计吧</strong></td>\n                                    <td>tuozhe8.com</td>\n                                    <td>适合找风格参考和空间细节灵感，尤其适合前期扩展视野</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>达人室内设计网</strong></td>\n                                    <td>darenji.com</td>\n                                    <td>更值得优先看实景案例，帮助判断哪些做法更接近真实落地</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>建E室内设计网</strong></td>\n                                    <td>justeasy.cn</td>\n                                    <td>偏专业资源库，适合看模型、材质和更完整的设计表达，但普通业主别陷进“图太美”里</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>A963设计网</strong></td>\n                                    <td>a963.com</td>\n                                    <td>适合开阔审美，但高端项目多，参考时更适合学配色、材质和氛围，不适合直接抄预算</td>\n                                </tr>\n                                <tr>\n                                    <td><strong>室内设计师联盟</strong></td>\n                                    <td>shejiben.com / 同类案例平台</td>\n                                    <td>适合广泛搜图，但一定要二次筛选，别把平台热图直接当你家方案</td>\n                                </tr>\n                            </table>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>📝 和设计师沟通时，参考图最该怎么交</h4>\n                            <ul>\n                                <li><strong>不要只发图，要配说明：</strong> 每张图旁边标一句“喜欢木色”“不喜欢吊顶”“想要这种餐边柜收纳逻辑”，比单发图片有效得多。</li>\n                                <li><strong>把“必须要”和“仅供参考”分开：</strong> 例如收纳、动线、儿童安全是必须；某个网红壁炉、异形灯槽只是参考。优先级不分，方案很容易跑偏。</li>\n                                <li><strong>给设计师看“反面案例”：</strong> 告诉他你不想要什么，往往比告诉他想要什么更能防止翻车。</li>\n                                <li><strong>一张图只表达一个重点：</strong> 不要期望一张图同时说明布局、材质、配色、收纳、灯光全部需求。</li>\n                                <li><strong>落地前追问预算与施工难度：</strong> 凡是悬空、弧形、特殊材质、极窄收口、无把手一门到顶等做法，都要提前问清成本和施工风险。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>📐 真正决定落地效果的，往往不是风格名，而是尺寸、比例和收口</h4>\n                            <ul>\n                                <li><strong>柜体好不好看，先看分缝和比例：</strong> 很多你以为的“高级感”，本质上来自门板比例、横竖分割、见光面处理，而不是单纯颜色选对了。</li>\n                                <li><strong>门、柜、墙面是连在一起看的：</strong> 如果只盯单个柜子效果图，不看门洞、踢脚线、门套、墙垛、插座位置，后面就很容易装得支离破碎。</li>\n                                <li><strong>悬空、极窄边、通顶、一门到顶，都对现场条件更挑剔：</strong> 这些做法不是不能做，而是要同步确认基层垂平、五金承重、安装误差和后期维修方式。</li>\n                                <li><strong>同样一张图，层高、户型、采光一变，效果就会完全不同：</strong> 所以落地前一定要问“这个比例在我家还成不成立”，而不是只问“做不做得到”。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🗂️ 把灵感图翻译成定制清单时，最该先写出来的 4 类信息</h4>\n                            <table class=\"material-table\">\n                                <tr>\n                                    <th>信息类型</th>\n                                    <th>你至少要说清什么</th>\n                                    <th>如果不说清，最容易怎么翻车</th>\n                                </tr>\n                                <tr>\n                                    <td>外观比例</td>\n                                    <td>是否通顶、是否有见光板、门板分缝、把手方式、侧板处理</td>\n                                    <td>做出来“功能差不多”，但观感完全不像参考图</td>\n                                </tr>\n                                <tr>\n                                    <td>功能尺寸</td>\n                                    <td>衣柜挂衣区高度、抽屉数量、鞋柜深度、餐边柜电器位、台盆柜让管方式</td>\n                                    <td>能看不能用，或者使用几天就开始后悔</td>\n                                </tr>\n                                <tr>\n                                    <td>安装边界</td>\n                                    <td>靠墙面是否需要找平、与门套/踢脚线/插座的交接、是否有检修需求</td>\n                                    <td>侧板不贴墙、收口条过宽、现场只能靠打胶补丑</td>\n                                </tr>\n                                <tr>\n                                    <td>材料五金</td>\n                                    <td>板材系列、封边、铰链滑轨、拉直器、灯带、电源件、反弹器</td>\n                                    <td>价格后面越加越多，或者同品牌里被换成低配</td>\n                                </tr>\n                            </table>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🧰 定制安装验收，最值得优先盯住的 5 个观察点</h4>\n                            <ul>\n                                <li><strong>柜门分缝是否基本均匀：</strong> 不求机械级误差，但肉眼明显一边宽一边窄，就不是“小问题”。</li>\n                                <li><strong>靠墙、靠顶、靠地的收口是否顺：</strong> 很多翻车不是柜子本身差，而是安装面没处理好、收口方案也没提前定。</li>\n                                <li><strong>功能位是否真按使用习惯落地：</strong> 比如挂衣区高度、抽屉开合、台盆下水避让、电器门开启范围。</li>\n                                <li><strong>五金是否和下单口径一致：</strong> 铰链、滑轨、反弹器、灯带、电源件这些最容易被“差不多”糊弄过去。</li>\n                                <li><strong>补件与整改机制是否明确：</strong> 定制最怕不是有问题，而是问题发现后没人管、补件周期无限拉长。</li>\n                            </ul>\n                        </div>\n                        <div class=\"info-box\">\n                            <h4>🔍 业主在看设计图和找灵感时最该追问的 8 个问题</h4>\n                            <ul>\n                                <li><strong>“我喜欢的是这个空间本身，还是这张照片的拍摄效果？”</strong> 先防止被镜头骗。</li>\n                                <li><strong>“这张图里哪些元素适合我家，哪些只是看看就好？”</strong> 学会拆解而不是整套照抄。</li>\n                                <li><strong>“这个设计在我的户型、预算、采光条件下还能成立吗？”</strong> 这是从审美走向落地的关键一步。</li>\n                                <li><strong>“如果只能保留 3 个重点，我最在意哪 3 个？”</strong> 避免最后什么都想要，结果什么都不像。</li>\n                                <li><strong>“这张灵感图如果落地，最关键的尺寸和比例是什么？”</strong> 把审美问题尽快翻译成执行问题。</li>\n                                <li><strong>“柜体、门、墙面、踢脚线这些交接关系，现在有图或清单能说明吗？”</strong> 这句专门防止安装阶段才发现不协调。</li>\n                                <li><strong>“哪些配置是效果图里默认有、报价单里却可能没写的？”</strong> 提前挖掉定制加价坑。</li>\n                                <li><strong>“这个做法后期好打理吗、好维修吗、会不会很快过时？”</strong> 住家不是展厅，耐用和日常体验同样重要。</li>\n                            </ul>\n                        </div>\n                    </div>"
 },

  "body": "<div class=\"tip-box\">\n                    <h4>💡 设备系统最怕的，不是贵，而是想晚了</h4>\n                    <p>很多业主会把中央空调、新风、地暖、进水系统理解成“后面买设备时再说”。但真到现场，才发现这些系统会反向影响<strong>水电点位、吊顶高度、柜体尺寸、门洞完成面、地面厚度、检修方式、合同报价和工种交接</strong>。它们不是单个产品，而是一整套前置协调关系。越晚想，返工越贵；越只盯品牌，越容易忽略真正花钱和扯皮的地方。</p>\n                </div>\n                <div class=\"content-grid\">\n                    <div class=\"info-box success-box\">\n                        <h4>🧭 这 4 套系统，最晚分别要在什么时候定掉</h4>\n                        <table class=\"material-table\">\n                            <tr>\n                                <th>系统</th>\n                                <th>最晚别晚于哪个节点</th>\n                                <th>为什么</th>\n                            </tr>\n                            <tr>\n                                <td>中央空调</td>\n                                <td>水电前，最好在方案阶段</td>\n                                <td>会影响吊顶高度、风口位置、冷媒管和冷凝水排布、检修口和灯位关系</td>\n                            </tr>\n                            <tr>\n                                <td>新风</td>\n                                <td>水电前，最好和中央空调一起定</td>\n                                <td>会影响管道走向、吊顶、风口位置、检修和噪音控制</td>\n                            </tr>\n                            <tr>\n                                <td>地暖</td>\n                                <td>水电前，最晚别晚于地面找平与门洞复核前</td>\n                                <td>会影响地面完成面厚度、门套高度、地材选择、锅炉和分集水器位置</td>\n                            </tr>\n                            <tr>\n                                <td>进水系统</td>\n                                <td>水电前，最晚别晚于橱柜方案和设备位确认前</td>\n                                <td>会影响总阀、前置过滤、净水/软水、管线机、插座和检修空间</td>\n                            </tr>\n                        </table>\n                        <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">一句话记住：<strong>只要会反向影响点位、尺寸、吊顶、地面或柜体的东西，都不该被当成“后面再买”</strong>。</p>\n                    </div>\n                    <div class=\"info-box warning-box\">\n                        <h4>⚠️ 这类系统最容易漏报的，不是设备本身，而是周边协同成本</h4>\n                        <ul>\n                            <li><strong>中央空调 / 新风：</strong> 风口、风管、保温、开孔、吊顶、检修口、冷凝水、控制面板、联调。</li>\n                            <li><strong>地暖：</strong> 分集水器、锅炉、温控器、找平、回填、门洞调整、地面完成面衔接。</li>\n                            <li><strong>进水系统：</strong> 前置过滤器、厨下净水、软水、管线机、插座、排水、橱柜开孔、检修空间。</li>\n                            <li><strong>所有系统共同点：</strong> 一旦和木工、瓦工、定制、安装打架，返工往往不是修一处，而是连带多个工种一起返。</li>\n                        </ul>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>❄️ 中央空调：别只问几匹和品牌，先问吊顶、风口和检修</h4>\n                        <table class=\"material-table\">\n                            <tr>\n                                <th>最值得先确认</th>\n                                <th>为什么重要</th>\n                                <th>最常见翻车</th>\n                            </tr>\n                            <tr>\n                                <td>层高和吊顶损失</td>\n                                <td>很多家庭不是不能装，而是装完后压层高太明显</td>\n                                <td>入住后觉得压抑，或者为了设备被迫做大面积下挂吊顶</td>\n                            </tr>\n                            <tr>\n                                <td>风口与灯位/柜体/窗帘盒关系</td>\n                                <td>这些位置一旦打架，后面不是改灯，就是改造型</td>\n                                <td>风口吹人、吹窗帘、挡柜门、见光不见灯做不出来</td>\n                            </tr>\n                            <tr>\n                                <td>冷凝水和检修口</td>\n                                <td>这是后期渗漏、维修和清洗最关键的底层条件</td>\n                                <td>检修困难、漏水找不到责任、维修时只能拆吊顶</td>\n                            </tr>\n                        </table>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🌬️ 新风：不是“装了就高级”，重点看层高、噪音和维护</h4>\n                        <ul>\n                            <li><strong>先看管道怎么走：</strong> 新风最容易和中央空调、灯槽、吊顶一起抢空间。</li>\n                            <li><strong>再看风口位置：</strong> 不只是好不好看，还关系到吹风感受、回风效率和清洁维护。</li>\n                            <li><strong>别忽略噪音：</strong> 机器位置、风管长度、弯头数量、风口布置都会影响体感。</li>\n                            <li><strong>必须想过滤更换和检修：</strong> 如果后面换滤芯都困难，使用率往往会快速下降。</li>\n                        </ul>\n                        <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">新风和中央空调最容易一起翻车的点，不是设备本身，而是<strong>两套系统都想占吊顶空间，却没人对总图负责</strong>。</p>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🔥 地暖：已经不是“装不装暖”，而是值不值、厚不厚、后面好不好收口</h4>\n                        <ul>\n                            <li><strong>先看使用习惯：</strong> 长期开、全屋供暖和局部偶尔开，对系统选择完全不同。</li>\n                            <li><strong>再看层高和地面完成面：</strong> 地暖会影响门洞高度、门套、踢脚线、地面材质衔接。</li>\n                            <li><strong>锅炉、分集水器和温控位置要提前定：</strong> 否则后面要么不好看，要么不好修。</li>\n                            <li><strong>别把地暖只当设备报价：</strong> 找平、回填、保护层、控制系统、后期维护都算总成本。</li>\n                        </ul>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>💧 进水系统：当前最容易被低估，但最容易和橱柜、水电、设备位打架</h4>\n                        <table class=\"material-table\">\n                            <tr>\n                                <th>常见配置</th>\n                                <th>适合先想什么</th>\n                                <th>晚想会怎样</th>\n                            </tr>\n                            <tr>\n                                <td>前置过滤器</td>\n                                <td>入户位置、阀门方向、检修空间、冲洗便利性</td>\n                                <td>后期装不下、维护不方便、总阀和过滤器互相打架</td>\n                            </tr>\n                            <tr>\n                                <td>厨下净水 / 管线机</td>\n                                <td>电源、排水、橱柜开孔、台面出水位</td>\n                                <td>橱柜打架、插座不够、台面二次开孔很被动</td>\n                            </tr>\n                            <tr>\n                                <td>软水 / 中央净水</td>\n                                <td>设备位、排水、旁通、后期加盐或维护空间</td>\n                                <td>设备摆不下、维护困难、管路改造复杂</td>\n                            </tr>\n                            <tr>\n                                <td>热水器 / 回水逻辑</td>\n                                <td>多卫热水等待时间、回水是否值得做、管路路径</td>\n                                <td>热水等待长、后悔想补回水时成本明显上升</td>\n                            </tr>\n                        </table>\n                    </div>\n                    <div class=\"info-box success-box\">\n                        <h4>📐 这些系统会反向影响哪些工种，一张表看清</h4>\n                        <table class=\"material-table\">\n                            <tr>\n                                <th>系统</th>\n                                <th>直接影响</th>\n                                <th>连带影响</th>\n                            </tr>\n                            <tr>\n                                <td>中央空调</td>\n                                <td>水电、木工吊顶、灯位、开孔</td>\n                                <td>柜体、窗帘盒、风口观感、检修</td>\n                            </tr>\n                            <tr>\n                                <td>新风</td>\n                                <td>水电、吊顶、风口、设备位</td>\n                                <td>噪音、层高、维护难度</td>\n                            </tr>\n                            <tr>\n                                <td>地暖</td>\n                                <td>地面找平、门洞、门套、锅炉位</td>\n                                <td>地材厚度、踢脚线、完成面高度</td>\n                            </tr>\n                            <tr>\n                                <td>进水系统</td>\n                                <td>水路、电源、设备位、橱柜开孔</td>\n                                <td>检修空间、台面出水、厨房动线</td>\n                            </tr>\n                        </table>\n                    </div>\n                    <div class=\"info-box warning-box\">\n                        <h4>📄 合同里最该写死的，不是“装哪个品牌”，而是谁负责协调和返工</h4>\n                        <ul>\n                            <li><strong>谁负责最终尺寸复核：</strong> 设备商、装修方、木工、定制，必须说清。</li>\n                            <li><strong>谁负责吊顶与检修口方案落地：</strong> 不要默认现场会自然配合。</li>\n                            <li><strong>谁负责点位和开孔：</strong> 强电、弱电、水路、控制面板、地暖温控、管线机插座都要明确。</li>\n                            <li><strong>返工边界怎么切：</strong> 是设备商改、木工改、油工修，还是定制重做，最好提前写进书面。</li>\n                            <li><strong>联调和交付标准：</strong> 风量、噪音、冷热效果、热水响应、过滤维护，不要只写“安装完成”。</li>\n                        </ul>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🔍 业主在设备系统阶段最该追问的 8 个问题</h4>\n                        <ul>\n                            <li><strong>“这套系统最晚什么时候必须定？”</strong> 先卡时间点，能挡掉大量返工。</li>\n                            <li><strong>“它会影响哪些吊顶、柜体、灯位和门洞尺寸？”</strong> 逼对方讲交叉影响，而不只是讲自己设备。</li>\n                            <li><strong>“后期检修和维护怎么做？”</strong> 不要只看安装图，要看 3 年后还能不能修。</li>\n                            <li><strong>“报价里哪些没含？”</strong> 重点问辅材、保温、开孔、吊顶、回填、联调、收口。</li>\n                            <li><strong>“谁来做最终尺寸复核？”</strong> 这句最能提前堵住甩锅口。</li>\n                            <li><strong>“哪些位置最容易和柜子、灯、窗帘盒打架？”</strong> 让对方现在指出，而不是后面临场解释。</li>\n                            <li><strong>“如果后面发现装不下或影响观感，按谁的问题返工？”</strong> 先问返工边界，再决定下单。</li>\n                            <li><strong>“有没有一张把设备、点位、吊顶和检修一起对齐的图或清单？”</strong> 没有统一口径，后期几乎必出错。</li>\n                        </ul>\n                        <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">如果你现在已经意识到很多设备系统问题最后都会落到<strong>插座、控制面板、给排水和设备位</strong>上，建议继续看：<a href=\"wiring-and-points.html\">水电点位前置规划专题</a>。那一页更适合把“点位到底要怎么定到能施工、能结算、能留证”讲透。</p>\n                    </div>\n                </div>"
 },

  "body": "<div class=\"tip-box\">\n                    <h4>💡 水电最怕的，不是多花一点钱，而是封起来以后才发现不顺手</h4>\n                    <p>很多人会把水电点位理解成“现场和工长边比划边定”的事。真正的问题是，一旦点位、给排水、回路和设备位没想清楚，后面最容易出现的不是小遗憾，而是<strong>柜子挡插座、灯位扫光难看、洗碗机没位置、净水没插座、床头充电不顺、马桶边没电源、热水器和橱柜打架</strong>。这些问题在开槽前都不难解决，封起来后返工成本就会大幅上升。</p>\n                </div>\n                <div class=\"content-grid\">\n                    <div class=\"info-box success-box\">\n                        <h4>🧭 点位最晚什么时候定，先记这 4 个时间节点</h4>\n                        <table class=\"material-table\">\n                            <tr>\n                                <th>项目</th>\n                                <th>最晚别晚于哪个节点</th>\n                                <th>为什么</th>\n                            </tr>\n                            <tr>\n                                <td>开关 / 插座 / 灯位</td>\n                                <td>水电定位前</td>\n                                <td>一旦开槽和布线完成，再改位置就要拆墙补墙</td>\n                            </tr>\n                            <tr>\n                                <td>洗碗机 / 净水 / 管线机 / 烘干机</td>\n                                <td>水电前，最晚别晚于柜体方案确定前</td>\n                                <td>会反向影响插座、给排水、柜体开孔和尺寸预留</td>\n                            </tr>\n                            <tr>\n                                <td>智能马桶 / 镜柜 / 电热毛巾架</td>\n                                <td>卫生间水电前</td>\n                                <td>这些都是最常见“后悔没留电”的项目</td>\n                            </tr>\n                            <tr>\n                                <td>中央空调 / 新风 / 地暖 / 进水系统联动点位</td>\n                                <td>设备系统方案确定后，立即同步到水电图</td>\n                                <td>这些系统会同时影响控制面板、插座、检修和设备位</td>\n                            </tr>\n                        </table>\n                    </div>\n                    <div class=\"info-box warning-box\">\n                        <h4>⚠️ 水电报价最容易失控的，不是单价，而是“按实际发生量”</h4>\n                        <ul>\n                            <li><strong>最少点位预估价：</strong> 前期看着便宜，真正施工时按你家的真实需求大量上浮。</li>\n                            <li><strong>只报电点不报水点：</strong> 后面龙头、洗碗机、净水、洗烘机一加，水路费用就冒出来。</li>\n                            <li><strong>只报基础点位，不报移位和回路：</strong> 大功率电器、厨房分路、空调回路经常后置收费。</li>\n                            <li><strong>图纸不清，只能现场解释：</strong> 图纸越模糊，后面越容易按“现场实际”为名重新加钱。</li>\n                        </ul>\n                        <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">真正稳的做法不是只盯“多少钱一个点”，而是先把<strong>需求 + 点位图 + 结算口径</strong>一起定下来。</p>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🛋️ 客餐厅最容易漏的，不是插座数量，而是使用场景</h4>\n                        <ul>\n                            <li><strong>沙发两侧：</strong> 手机充电、落地灯、扫地机、临时小家电都可能用到。</li>\n                            <li><strong>电视墙：</strong> 电视、电源、网口、机顶盒、投影、路由、音响要按方案预留，不要只留一个电视插座。</li>\n                            <li><strong>餐边柜：</strong> 咖啡机、热水壶、小冰箱、氛围灯、净饮设备都可能上这里。</li>\n                            <li><strong>扫地机基站：</strong> 这是最容易“入住后才发现没地方放”的点位。</li>\n                            <li><strong>灯位：</strong> 主灯、无主灯、洗墙、射灯、吊灯不是只比外观，要先看家具摆位和动线。</li>\n                        </ul>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🍳 厨房最容易翻车的，是电器和给排水没一起想</h4>\n                        <table class=\"material-table\">\n                            <tr>\n                                <th>高频项目</th>\n                                <th>最该提前想什么</th>\n                                <th>晚想会怎样</th>\n                            </tr>\n                            <tr>\n                                <td>洗碗机</td>\n                                <td>电源、进排水、柜体位、门板开启</td>\n                                <td>橱柜重做或只能牺牲收纳</td>\n                            </tr>\n                            <tr>\n                                <td>净水 / 管线机</td>\n                                <td>插座、排水、台面开孔、厨下空间</td>\n                                <td>插座不够、走线凌乱、橱柜内太拥挤</td>\n                            </tr>\n                            <tr>\n                                <td>冰箱 / 蒸烤箱 / 微蒸烤</td>\n                                <td>电源高度、散热、插座位置、柜体尺寸</td>\n                                <td>设备装不进去或插头和柜体打架</td>\n                            </tr>\n                            <tr>\n                                <td>垃圾处理器</td>\n                                <td>插座、开关、下水和空间关系</td>\n                                <td>后期只能将就装，维护也困难</td>\n                            </tr>\n                        </table>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🛁 卫生间最容易后悔的，不是少一个插座，而是少在关键位置</h4>\n                        <ul>\n                            <li><strong>智能马桶电源：</strong> 太多人是入住后才后悔没留。</li>\n                            <li><strong>镜柜和吹风机位：</strong> 不只是镜前灯，还要考虑日常使用和收纳。</li>\n                            <li><strong>电热毛巾架 / 浴霸 / 风暖：</strong> 这些都不是最后随便补电就能优雅解决的。</li>\n                            <li><strong>洗衣机 / 烘干机在卫浴附近时：</strong> 给排水、电源、地漏和柜体要一起看。</li>\n                            <li><strong>花洒和台盆关系：</strong> 给排水移位、地漏坡度、柜体尺寸常常一起打架。</li>\n                        </ul>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🛏️ 卧室最容易被忽略的，是床头、书桌和未来变化</h4>\n                        <ul>\n                            <li><strong>床头两侧：</strong> 手机、台灯、加湿器、电动窗帘、床头挂灯都可能用到。</li>\n                            <li><strong>儿童房 / 次卧：</strong> 未来用途变化大，点位要比现在多想一步。</li>\n                            <li><strong>书桌和梳妆位：</strong> 插座、台灯、电脑、路由、镜灯、吹风机使用方式不同。</li>\n                            <li><strong>投影 / 壁灯 / 感应灯：</strong> 这类容易被后加需求最该前置考虑。</li>\n                        </ul>\n                    </div>\n                    <div class=\"info-box success-box\">\n                        <h4>📋 点位图至少要写到什么程度，才不算“空图”</h4>\n                        <ul>\n                            <li><strong>每个点位在哪个空间、哪面墙：</strong> 不能只说“客厅插座若干”。</li>\n                            <li><strong>大致高度和用途：</strong> 比如电视位、床头位、餐边柜位、洗碗机位。</li>\n                            <li><strong>设备位对应什么：</strong> 插座不是孤立的，要写是给谁用的。</li>\n                            <li><strong>给排水和电点是否成对：</strong> 厨房、卫生间、阳台尤其重要。</li>\n                            <li><strong>回路和大功率电器边界：</strong> 厨房、空调、地暖、电热设备不要全部混成一团。</li>\n                        </ul>\n                        <p style=\"color:var(--text-secondary);font-size:0.92rem;margin-top:1rem;\">你不一定要自己画专业施工图，但至少要让施工方拿得出一份<strong>你能看懂、能核对、能复盘</strong>的点位口径。</p>\n                    </div>\n                    <div class=\"info-box warning-box\">\n                        <h4>📸 封槽前，这 4 类证据一定要拍</h4>\n                        <ul>\n                            <li><strong>全景走向：</strong> 哪面墙开了哪些槽，整个空间先拍一圈。</li>\n                            <li><strong>点位近景：</strong> 插座盒、开关位、给排水点、地漏、设备位逐个拍。</li>\n                            <li><strong>尺寸参照：</strong> 带卷尺、门洞、柜体位置、家具参考点一起拍。</li>\n                            <li><strong>回路 / 管线说明：</strong> 最好配一份简单文字或图纸口径，不然后期照片也可能看不懂。</li>\n                        </ul>\n                    </div>\n                    <div class=\"info-box\">\n                        <h4>🔍 业主在水电定位阶段最该追问的 8 个问题</h4>\n                        <ul>\n                            <li><strong>“这个点位是给哪个设备或哪个动作准备的？”</strong> 防止为了“多留几个”而乱留，也防止关键位没留。</li>\n                            <li><strong>“哪些点位最晚今天必须定，过了就会影响施工？”</strong> 先卡时间窗口。</li>\n                            <li><strong>“厨房和卫生间哪些给排水、电源必须成对考虑？”</strong> 逼对方讲联动，不只讲单点。</li>\n                            <li><strong>“柜子装完以后，这个插座 / 下水还能不能正常用？”</strong> 专门防止定制挡住使用。</li>\n                            <li><strong>“这份报价按什么口径结算？是按图，还是按现场实际发生量？”</strong> 这是防加价的核心问题。</li>\n                            <li><strong>“大功率设备和常用设备的回路怎么分？”</strong> 不需要你会画电路，但要逼对方说清逻辑。</li>\n                            <li><strong>“封槽前会不会给我一份最终点位确认和现场照片？”</strong> 这是后期追责的证据来源。</li>\n                            <li><strong>“如果后面发现点位影响柜体或设备安装，按谁的问题返工？”</strong> 先问责任，再动工。</li>\n                        </ul>\n                    </div>\n                </div>"
 }
};

/* ---------- 工具一：报价单逐项核对 / 漏项自查 ---------- */
quote: {
  title:"报价单逐项核对 · 漏项自查",
  sub:"重点不是砍价，是先把「报价单覆盖了多少真实工程量」搞清楚",
  groups:[
    {name:"A · 报价单本身是否可用", items:[
      {t:"报价单是否把「工程项目名称 + 单位 + 工程量 + 单价 + 合价」五列写全", tip:"缺任何一列，后期都靠现场「实量实算」来补刀。工程量那列空白的和「以实际发生为准」性质一样。", must:true},
      {t:"是否附上施工图纸、点位图、材料表并盖骑缝章/双方签字", tip:"报价单失去图纸支撑，就等于没有一个明确的施工范围，出问题时双方各拿一份不同的图。", must:true},
      {t:"报价是否注明有效期与「未列入项是否视为已包含」", tip:"很多报价单默认「未列项目不含」，这是所有漏项的法理出口。要写反：未列入但属于本工程合理必要的，视为已含在总价内。", must:true},
      {t:"是否存在「成品保护费/垃圾清运费/管理费」重复出现在不同分项里", tip:"管理费、垃圾清运、成品保护是最容易在大项里含一次、在杂费里再收一次的。", must:true},
      {t:"是否有「水电、防水按实际结算」这类开口项", tip:"开口项=预算失控入口。要么封顶（最高不超过 X 元），要么先出预估量+单价并约定超出 X% 才调整。"},
    ]},
    {name:"B · 拆除与结构改造", items:[
      {t:"墙体拆除—是否为承重墙/剪力墙，有无物业报批与原结构图纸核对", tip:"承重结构一旦动了，物业押金、邻里投诉、行政处罚和后期安全责任都落在业主头上。", must:true},
      {t:"拆除后垃圾外运—是否含从楼上搬到小区指定点、是否含运费", tip:"「含清运」常常只含到楼下堆放点，外运到消纳场的车费另算。"},
      {t:"门洞/窗洞改造、新开门洞是否含加固（过梁、门楣）", tip:"新开门洞的过梁是必做项，不报价就变成增项，不做则后期门头下沉开裂。"},
      {t:"外墙/阳台改动是否含物业押金、是否注明「按物业要求恢复」的责任方", tip:"很多小区要求原样恢复或交押金，这笔钱和责任归属要提前写。"},
      {t:"原地面/墙皮铲除是否含「铲到结构层」与「铲除后找平」", tip:"报价常只写「铲除」，找平另列。而旧房不铲到结构层，后期腻子必然空鼓。"},
    ]},
    {name:"C · 水电改造（最容易漏、也最容易爆）", items:[
      {t:"水管铺设—是否含开槽、封槽、管卡固定、试压", tip:"「铺设」二字可以不含开槽。开槽封槽往往是水电里第二贵的一块。", must:true},
      {t:"电线回路是否按实际需要分路（空调/厨房/卫生间/大功率独立回路）", tip:"回路不够比用线差更致命：全屋共用一个回路，后期跳闸是常态，且无法整改。", must:true},
      {t:"是否注明线径（照明 2.5mm²、插座 4mm²、中央空调 6mm² 及以上）", tip:"只写品牌不写线径，是水电里最常见的降标配手法。"},
      {t:"弱电是否含网线、有线电视、电话线的重新布线与模块安装", tip:"弱电常被漏报，后期临时加网线代价很高。"},
      {t:"配电箱是否含增容/更换、漏保更换、回路标识", tip:"老房原配电箱容量不够是常态，增容不写就只能用旧箱凑合。"},
      {t:"点位数量是否已按图纸清点并写死（超出单价已约定）", tip:"点位按「实际结算」的公司，报名阶段一定把点位数量报少。"},
      {t:"下水管改造是否含存水弯、检修口、隔音棉包管", tip:"缺少检修口，后期堵塞只能砸墙；缺隔音棉，楼上冲水声音直接进卧室。"},
      {t:"地漏、下水口移位是否含找坡和防水恢复", tip:"移位必破坏原防水，恢复不写就是后期漏水的高频来源。"},
      {t:"是否含打压试验与通电测试的书面记录", tip:"没有记录的调试，等于没有做。这是隐蔽工程留证的最低要求。", must:true},
    ]},
    {name:"D · 防水与泥瓦", items:[
      {t:"防水施工部位是否逐处列明（卫生间、阳台、厨房、屋面/外墙内侧面）", tip:"只写「卫生间做防水」，阳台、管根、门槛石两侧就会变成加钱项。", must:true},
      {t:"涂刷高度是否写死（淋浴区 ≥1.8m、其余 ≥0.3m 的常见做法）", tip:"只写「按规范」，等于没写。高度是要写在合同里的可执行数字。"},
      {t:"是否含 24~48 小时闭水试验并出具记录", tip:"不做闭水就贴砖，等于把返工的主动权送出去。", must:true},
      {t:"卫生间回填是否注明材料（陶粒/发泡水泥）是否含二次排水", tip:"「建筑垃圾回填」是老办法，沉箱积水会长期返臭；二次排水口漏做则隐患翻倍。"},
      {t:"瓷砖是否区分砖价、铺贴人工、辅料（粘结剂/背胶）、美缝", tip:"四个东西分开报，总价看起来就低。你要问的是「全部含在内的落地价每平米多少钱」。", must:true},
      {t:"是否含地面找平（含最厚处的厚度上限）", tip:"找平按厚度分档加价是常规套路，报价时必须写厚度上限。"},
      {t:"是否含过门石、窗台石、门槛、包管、阴阳角条", tip:"这几项单看不多，加起来经常上万元。", must:true},
      {t:"是否含墙面拉毛/背胶/砖背胶处理（大砖、玻化砖必做）", tip:"大砖不背胶，一年内空鼓脱落是必然，而且没法局部修。"},
    ]},
    {name:"E · 木工与吊顶", items:[
      {t:"吊顶是否注明龙骨间距、板材品牌与厚度、是否含灯槽/检修口", tip:"检修口漏做，后期查漏水只能拆吊顶。"},
      {t:"是否为整板过梁错位拼接（防开裂），转角是否 L 形整板", tip:"转角用两块板拼，必裂。这条是吊顶开裂的第一成因。"},
      {t:"是否含隔音/保温填充（顶面隔音棉、墙体吸音）", tip:"隔音材料不写，报价会先低下来，等你觉得吵再补一倍价钱。"},
      {t:"柜体/造型若由公司做：是否含五金（铰链、抽屉轨道、拉手）型号", tip:"柜体报价不含五金是最经典的「低总价入门」。", must:true},
      {t:"是否含门套基层、窗套基层、背景墙基层（木工打底）", tip:"基层是木工的活但常写在主材商名下，两边都不认。"},
    ]},
    {name:"F · 腻子与油漆", items:[
      {t:"腻子是否注明遍数、品牌、是否为耐水腻子", tip:"不写遍数，就只刮两遍；不耐水的腻子后期遇潮起皮。"},
      {t:"是否含阴阳角找直（PVC 或金属护角）", tip:"阴阳角不找直，灯一开整面墙都是波浪。"},
      {t:"乳胶漆是否含底漆 + 面漆的遍数与型号", tip:"省底漆是最常见的隐形降配，一年后泛碱发花。"},
      {t:"旧墙是否含铲除原腻子、界面剂/墙固", tip:"墙固不写，旧墙新腻子必然空鼓。"},
      {t:"是否含家具、地面、开关面板的成品保护", tip:"成品保护看似小事，刷完漆才发现地板全是漆点通常无处说理。"},
    ]},
    {name:"G · 主材与末端安装（谁供货谁安装必须写清）", items:[
      {t:"地板—是否含防潮垫、踢脚线、收边条、安装费", tip:"地板报价是主材+辅料+安装三块，只报主材价的都是钓鱼。"},
      {t:"门—是否含门套、锁具、合页、门吸、安装与发泡填充", tip:"门吸、合页常被单独列成小额增项，数量一多也是钱。"},
      {t:"洁具/马桶/花洒是否含安装、角阀软管、打胶", tip:"角阀软管是必换件，不写就现场临时买高价配件。"},
      {t:"灯具/开关插座—是否含安装与开孔", tip:"安装不含在报价里，灯具一多就是几百到上千。"},
      {t:"橱柜/全屋定制—是否含测量、复尺、运输、上楼、售后", tip:"定制柜复尺后的「实际面积」往往比合同面积高，这是行业惯例也是最大争议点。"},
      {t:"主材是否在报价里写明到货时间，并约定延期到货导致的停工由谁承担", tip:"主材延期是装修延期的第一大原因，责任必须跟延误违约金挂钩。", must:true},
    ]},
    {name:"H · 管理与杂项（重复计费重灾区）", items:[
      {t:"管理费、设计费、税金是否只收一次且写在主报价里", tip:"管理费是最容易「主报价收 8%，增项里再收一次 8%」的地方。"},
      {t:"成品保护费、现场清理费是否与前面的分项重复", tip:"同一项在两个地方出现，说明报价单是拼出来的，可信度极低。"},
      {t:"是否含施工水电费、电梯使用费、物业押金（谁付）", tip:"这几项通常由业主承担，但要写明并非「额外代缴手续费」。"},
      {t:"是否有「远程费」「楼层费」「节假日施工费」等模糊附加费", tip:"这类属于事前模糊定价项，签约前必须全部清零或写死金额。"},
      {t:"每个施工阶段的验收标准与「不合格如何返工、费用由谁承担」", tip:"没有返工责任条款的验收标准，写再多也只是纸面文章。", must:true},
    ]}
  ]
},

/* ---------- 工具二：签约前复核清单 ---------- */
sign: {
  title:"签约前复核清单",
  sub:"签之前每一条都要有答案。答不上来的，别急着签字。",
  groups:[
    {name:"A · 主体资格（先确认对方是谁）", items:[
      {t:"签约主体是否与营业执照、公章名称完全一致", tip:"签给设计师个人或「XX 工作室」的，出事后很难追偿。", must:true},
      {t:"营业执照经营范围、注册地址、成立年限是否核实", tip:"成立不足一两年的新主体，跑路成本低。"},
      {t:"是否为「内部承包/挂靠」模式，实际施工方是谁", tip:"挂靠是行业普遍现象，你至少要清楚最后负责的人是谁。"},
      {t:"设计师/项目经理是否为该公司员工、是否签了授权委托书", tip:"个人收款、个人签字收钱的，一律要在合同里禁止。"},
      {t:"是否有固定经营场所（可实地到场），是否留存法人/负责人身份信息与联系方式", tip:"只有展厅没有办公地点的，纠纷时找不到人。", must:true},
    ]},
    {name:"B · 施工范围与附件", items:[
      {t:"施工范围是否用「图纸 + 点位图 + 报价清单」三方锁定并签字盖章", tip:"范围没锁死，所有讨论都是空的，这是合同里最值钱的几页纸。", must:true},
      {t:"是否写明「不含项目」清单（避免事后被说成没包含）", tip:"不含项和含项同样重要。含糊的不含项，是最容易变成增项的地方。"},
      {t:"报价单、材料表、工艺说明是否作为附件并注明「与主合同同等效力」", tip:"附件不写同等效力，后期对方可以不认。"},
      {t:"是否有「未列入项目视为已包含在总价内」条款", tip:"这是封住漏项出口的关键一句，务必写进去。", must:true},
      {t:"工程量是否允许「实量实算」，若允许则是否有误差上限", tip:"没有误差上限的实量实算，本质就是让对方重新定价。"},
    ]},
    {name:"C · 材料与工艺约定", items:[
      {t:"主材是否写死品牌 + 系列 + 型号（不是只写品牌名）", tip:"同一个品牌的产品差价能到 3~5 倍，只写品牌等于没写。", must:true},
      {t:"辅材（水泥、砂浆、腻子、防水、胶、电线管材）是否全部列明", tip:"辅材是最容易「换廉价替代」的地方。", must:true},
      {t:"是否有「材料替换需业主书面同意，否则视为违约」条款", tip:"没有这个条款，现场「缺货，用同档次的」就成了常态。"},
      {t:"是否约定进场材料要业主确认并留存照片/小样", tip:"不留样品，后期对比无据。"},
      {t:"关键工艺是否有量化标准（防水层高度、闭水时长、腻子遍数、龙骨间距）", tip:"形容词不构成标准。只有数字能在争议时被判定。"},
      {t:"是否注明材料的环保等级并要求提供检测报告（板材 GB 18580、涂料 GB 18582 等）", tip:"口头环保不算数，报告才有意义。"},
    ]},
    {name:"D · 工期与延期", items:[
      {t:"开工日期、竣工日期是否为确定日期（而非「约 X 天」）", tip:"「约」字一出，工期就是废条款。", must:true},
      {t:"延期违约金是否明确到「每日 X 元或总价的 X‰」并设置上限", tip:"没有违约金的工期条款基本无效。"},
      {t:"是否界定「业主原因 vs 公司原因」造成的延期分别如何处理", tip:"没有区分，任何延期都会归到业主头上。"},
      {t:"是否考虑节假日、小区施工规定、物业管控时间", tip:"很多小区禁止周末噪音施工，这要提前算进工期。"},
      {t:"是否约定不可抗力的举证责任与通知义务", tip:"把所有拖延都说成不可抗力，是常见手段。"},
    ]},
    {name:"E · 付款节点（最重要的一页）", items:[
      {t:"首付款比例是否合理，建议不超过合同总价 30%", tip:"付得越多，主动权越少。开工就付到 60% 的不要签。", must:true},
      {t:"每一笔款是否与明确的验收节点绑定（不是日期）", tip:"按日期付款等于没验收就给钱，是最危险的付款方式。", must:true},
      {t:"尾款是否 ≥5% 且明确在竣工验收合格后才支付", tip:"尾款太少，收尾就没人管；这也是唯一能约束对方的钱。", must:true},
      {t:"增项款是否与主合同约定同一付款节奏", tip:"增项要求全款先付，是最常见的资金陷阱。"},
      {t:"是否禁止向个人账户付款（只认公司对公账户并索取发票）", tip:"打给个人的款，法律上很难证明是付给公司的。"},
      {t:"是否有明确的收款方式、账号、开票义务", tip:"不开票的报价往往含「不含税」的模糊空间。"},
    ]},
    {name:"F · 变更与增项", items:[
      {t:"是否约定「先书面确认单价与金额，再施工」", tip:"先做后报价，是所有增项纠纷的源头。", must:true},
      {t:"是否约定单一增项累计超过 X 元或总价 X% 需重新协商", tip:"没有上限，增项可以无限长。"},
      {t:"变更单是否为统一文本，是否要求业主签字留档", tip:"口头变更 = 后面必然赖账。"},
      {t:"是否约定「设计师口头承诺」须书面确认方为有效", tip:"这一条能挡掉一半的后期扯皮。"},
      {t:"是否明确拆除后发现的新问题（如原墙空鼓、管线老化）的处理与费用责任", tip:"老房几乎必遇，不提前写就是现场加价。"},
    ]},
    {name:"G · 验收与保修", items:[
      {t:"是否约定分阶段验收节点与各方参与人", tip:"只有竣工才验收，隐蔽工程的质量就永远是个谜。", must:true},
      {t:"验收不合格的处理：返工时限、费用承担、是否顺延工期", tip:"不合格还要付钱，这是最吃亏的情形。"},
      {t:"保修期是否明确（一般项目 2 年、防水 5 年是常见约定）", tip:"保修越短越好省事？不对，防水只有 2 年保修的要格外小心。"},
      {t:"是否约定报修响应时限（如 48 小时内上门）", tip:"没有响应时限，保修就变成无限拖延。"},
      {t:"是否约定漏水/渗漏的赔偿责任（含楼下邻居损失）", tip:"这条一定要写：漏水造成的损失往往比装修本身还贵。"},
      {t:"是否留存保修金或书面保修承诺书", tip:"口头保修等于没有保修。"},
    ]},
    {name:"H · 违约、解除与争议", items:[
      {t:"是否约定单方解除的条件与结算方式", tip:"做不下去要能体面退出，且已完工部分如何作价要写清。"},
      {t:"是否约定争议解决方式（协商/调解/诉讼地）", tip:"诉讼地写对方所在地，你的维权成本会高很多。"},
      {t:"是否约定证据形式（照片、视频、聊天记录、书面确认单可作为依据）", tip:"这一条能大幅提升你后期维权时的举证能力。"},
      {t:"是否约定施工安全、消防、邻里损害的责任归属", tip:"工地出事（火灾、漏水到楼下、高空坠物），责任必须在第一手写清。"},
      {t:"是否留存双方签署的完整合同原件（含每页骑缝章）", tip:"只有单页签字没有骑缝章的合同，附件很可能被换。"},
    ]}
  ]
},

/* ---------- 工具三：分阶段验收清单 ---------- */
accept: {
  title:"分阶段验收清单",
  sub:"每个节点都要先验收再付款。带 📷 的项目必须拍照留证。",
  groups:[
    {name:"开工前 · 材料进场", node:"进场", items:[
      {t:"核对进场材料的品牌、型号、规格是否与报价单/合同附件一致", tip:"开箱就核对，别等安装完。包装、合格证、批号一起拍。" ,photo:true, must:true},
      {t:"核对数量与批号，同一批次避免色差", tip:"瓷砖、地板不同批次有色差是常态，一次到货最稳。", photo:true},
      {t:"检查是否有合格证、检测报告（板材/涂料/防水）", tip:"没有报告的材料，环保承诺无从谈起。", photo:true},
      {t:"拍照留证：全景 + 特写（含包装文字）+ 位置参照", tip:"三件套齐了，后期才算有效证据。", photo:true, must:true},
      {t:"现场是否做成品保护、是否有消防设施与安全提示", tip:"这一步能看出队伍的管理水平，也能看出你后面操心的程度。"},
      {t:"确认物业手续、施工许可、垃圾清运方式已办妥", tip:"手续没办就开工，被物业停工的时间算谁的要先说清。"},
    ]},
    {name:"水电改造 · 隐蔽工程", node:"水电", items:[
      {t:"验收点位是否与图纸一致、数量是否与约定相符", tip:"拿图纸现场点一遍，别用眼睛扫。", photo:true, must:true},
      {t:"检查回路设置：空调/厨房/卫生间/大功率是否独立回路", tip:"不够分回路的，入住后天天跳闸。", must:true},
      {t:"检查线径是否符合约定，穿管是否为整管无接头", tip:"线径用卡尺或看印字；管内不得有接头这是底线。"},
      {t:"强弱电是否分开穿管、间距是否符合要求、交叉是否做屏蔽", tip:"强弱电同管会造成信号干扰。", photo:true},
      {t:"水管走向走顶还是走地是否按约定，固定是否牢固", tip:"走顶漏水能发现、维修成本低；走地要额外关注。"},
      {t:"给水管做打压试验并有书面/影像记录（常见做法：0.8MPa 稳压 30 分钟以上）", tip:"不打压就封槽，等于放弃发现漏水的机会。", photo:true, must:true},
      {t:"管路拍照留存（封槽前必拍，作为后期维修的地图）", tip:"封槽后你再也不会知道管子在哪。", photo:true, must:true},
      {t:"检查线管内穿线截面积利用率（不能塞满，便于散热与换线）", tip:"塞得太满，后期无法换线。", photo:true},
      {t:"检查排水坡度、存水弯、检修口是否到位", tip:"没检修口，堵了只能砸。"},
      {t:"确认下水管口全部做临时封堵，防止施工垃圾堵塞", tip:"水泥块掉进下水管是后期返水的常见原因。", photo:true},
      {t:"确认弱电箱、配电箱位置合理，是否有检修空间", tip:"被柜子挡死的配电箱，后期无法维修。"},
    ]},
    {name:"防水与闭水试验", node:"防水", items:[
      {t:"检查基层是否处理到位（清理、修补、阴阳角圆弧、管根加强）", tip:"基层不合格，刷再好的防水涂料也没用。", photo:true, must:true},
      {t:"检查涂刷高度是否达到约定（淋浴区、非淋浴区分别核实）", tip:"拿尺子量，别听口头高度。", photo:true, must:true},
      {t:"检查涂刷遍数与厚度是否均匀、有无漏刷、起皮、砂眼", tip:"一遍到位是最常见的偷工，可以要求看到第二遍。", photo:true},
      {t:"闭水试验（常见做法 24~48 小时）并留存影像、通知楼下邻居配合查看", tip:"不做闭水就贴砖，是把自己放在最被动的位置。", photo:true, must:true},
      {t:"闭水后到楼下检查有无渗漏痕迹，双方签字确认", tip:"楼下没查，等于没做。"},
      {t:"门槛石两侧、管根、地漏周边是否做重点加强", tip:"90% 的卫生间漏水来自这三个位置。", photo:true},
      {t:"确认二次排水（回填层）是否设置", tip:"沉箱积水无法排出会长期返潮返臭。"},
      {t:"确认闭水试验合格后到贴砖前已做保护层", tip:"防水层被后续施工破坏是白做。"},
    ]},
    {name:"泥瓦 · 防水回填与瓷砖铺贴", node:"泥瓦", items:[
      {t:"确认回填材料是否按约定（非建筑垃圾），是否夯实", tip:"建筑垃圾回填会刺破防水层，也会长期沉降。", photo:true},
      {t:"检查瓷砖排版是否按图施工、是否为通缝/对花", tip:"不排版就铺，最后一定出现窄条和错缝。"},
      {t:"随机敲击检查空鼓率（单块砖空鼓面积与整体比例都要看）", tip:"建议买一把空鼓锤全屋敲一遍，重点查砖的四角和边缘；单砖空鼓面积过大或整屋空鼓率超标的，要求当场返工。", must:true},
      {t:"检查平整度与相邻砖高差（用手摸、用靠尺）", tip:"高差超过可接受范围要当场要求整改。"},
      {t:"检查坡度：地漏处是否为最低点，是否有积水", tip:"泼一盆水看流向，这是最直接的检测法。", must:true},
      {t:"检查阴阳角是否方正、阳角是否崩边", tip:"阴阳角崩边后期无法补救。"},
      {t:"检查地砖是否做了留缝、是否为后期美缝留足深度", tip:"没留缝的砖，热胀冷缩后必拱。"},
      {t:"检查瓷砖开孔是否规范（使用开孔器，非直接切割）", tip:"毛边开孔直接影响观感和后期安装。"},
      {t:"检查地面石材/门槛石是否做背胶、是否有断裂", tip:"门槛石断裂通常意味着基层没做实。"},
      {t:"成品保护：地砖铺完是否覆盖保护膜", tip:"后期施工划伤地砖无法局部更换。"},
    ]},
    {name:"木工 · 吊顶与造型", node:"木工", items:[
      {t:"检查龙骨间距是否符合约定、主龙骨是否固定到结构层", tip:"间距过大是吊顶下沉的直接原因。", photo:true},
      {t:"检查转角是否为 L 形整板（防开裂）", tip:"转角拼接处 100% 会裂，这是防开裂的关键。", photo:true, must:true},
      {t:"检查接缝是否为错位错缝、是否留 V 型槽、是否做防裂处理", tip:"直缝对接 + 无 V 槽 = 必裂。"},

talks: [

  {say:"水电没办法预估，都是实量实算的，行业都这样。", ask:"那请出一份预估工程量清单并约定「总价误差不超过 X%，超出部分公司承担」。", why:"实量实算本身合理，但无限误差就等于重新定价。"},

  {say:"管理费收 8% 是行业规定。", ask:"那请把管理费对应的服务内容列出来（含巡检次数、项目经理到场频次）。", why:"管理费不是税率，它必须对应具体的服务交付。"},
  {say:"我们的材料都是大品牌，环保没问题，放心。", ask:"请写明板材/涂料的具体系列型号，并提供同批次的检测报告。", why:"同一品牌的产品环保等级差距巨大，「品牌」不构成任何承诺。"},
  {say:"我们工人都是公司自己的，绝不外包。", ask:"那请在合同里写明：本项目不得转包或再分包，违者视为根本违约并退还全部管理费。", why:"转包是行业常态，能写进合同的公司才敢真承诺。"},
  {say:"这个品牌缺货了，我给你换个同档次的，比原来的还好。", ask:"同档次谁定义？先别装，我确认过再说；另外合同里要写「材料替换须业主书面同意」。", why:"「同档次」的定义权在对方手上时，它就永远意味着更便宜的那一款。"},
  {say:"这些都是小钱，几百块钱的事，别影响进度嘛。", ask:"那就走正常的变更单流程，几十块也照登不误，我签字付款。", why:"小额开口的目的是建立「可以现场加钱」的习惯，后面就是几千上万。"},
  {say:"工期写 90 个工作日，剩下的是天气和物业的原因。", ask:"请写明确定日期，并把延期违约金写成每日具体金额。", why:"「约 X 天」+ 不可抗力兜底 = 工期条款失效。"},
  {say:"尾款 5% 就算了，反正你也看不出问题，先结了吧。", ask:"尾款挂到竣工验收单签署、遗留问题整改完成之后支付。", why:"尾款是你手上唯一还能调动对方的钱。"},
  {say:"保修五年，这个你放心，都是行规。", ask:"请把保修范围、年限、响应时限、以及渗漏造成的第三方损失赔偿都写进合同。", why:"口头保修没有边界、没有响应时限，也就没有效力。"},

  function search(term) {
    var out = [];
    function hit(title, to, text) {
      var i = text.indexOf(term);
      if (i < 0) return;
      var s = Math.max(0, i - 30), e = Math.min(text.length, i + term.length + 60);
      var snip = text.slice(s, e).replace(/\s+/g, ' ');
      snip = snip.replace(term, '%%' + term + '%%');
      out.push({ to: to, title: title, snippet: esc(snip).replace(/%%(.*?)%%/g, '<em>$1</em>') });
    }
    ORDER.forEach(function (slug) {
      var c = C[slug]; if (!c) return;
      var text = (c.title + ' ' + c.subtitle + ' ' + c.summary + ' ' + c.body).replace(/<[^>]+>/g, ' ');
      var ex = E[slug];
      if (ex) {
        text += ' ' + (ex.views || []).map(function (v) {
          return v.points.map(function (p) { return p.t + ' ' + p.d; }).join(' ');
        }).join(' ');
        text += ' ' + (ex.redlines || []).join(' ') + ' ' + (ex.talks || []).map(function (t) { return t.say + t.ask; }).join(' ');
      }
      hit(c.title, 'chapters/' + slug, text);
    });
    D.forEach(function (d) {
      hit('📐 ' + d.t, 'diagram/' + d.key,
        d.t + ' ' + d.std + ' ' + d.why + ' ' + d.check + ' ' + d.bad);
    });
    return out;
  }

    return Math.round(n / total * 100);
  }

  /* ---------------- 通用勾选清单视图 ---------------- */
  function ckView(prefix, items, title, sub) {
    var total = items.length, done = 0, skip = 0;
    items.forEach(function (it, i) {
      var v = checks[prefix + ':' + i];
      if (v === 'y') done++; else if (v === 'x') skip++;
    });
    var base = total - skip;
    var pct = base > 0 ? Math.round(done / base * 100) : 0;

    var h = '<div class="progress-line">' +
      '<div class="progress-track"><i style="width:' + pct + '%"></i></div>' +
      '<div class="progress-txt"><span>完成 ' + done + ' / ' + base + '</span><span>' + pct + '%</span></div></div>';

    h += '<div class="hint-box"><b>' + esc(title || '') + '</b>' + (sub ? ' · ' + esc(sub) : '') + '</div>';

    h += items.map(function (it, i) {
      var id = prefix + ':' + i;
      var v = checks[id] || '';
      var nv = notes[id] || '';
      return '<div class="card" style="margin:10px 16px 0;padding:12px 13px">' +
        '<div class="ck" style="padding:0;border:0">' +
          '<div class="ck-main">' +
            '<div class="ck-t">' + esc(it.t) + (it.must ? '<span class="must">重点</span>' : '') + '</div>' +
            (it.tip ? '<div class="ck-tip">' + esc(it.tip) + '</div>' : '') +
            '<div class="ck-opts">' +
              opt(id, 'y', '已确认', v) + opt(id, 'n', '有问题', v) + opt(id, 'x', '不适用', v) +
            '</div>' +
            '<div class="ck-note"><input data-act="note" data-id="' + id + '" placeholder="备注：现场情况 / 报价金额 / 对方回复" value="' + esc(nv) + '"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    h += '<div class="btn-row">' +
      '<button class="btn ghost" data-act="ck-reset" data-id="' + prefix + '">重置本章</button>' +
      '<button class="btn" data-act="ck-export" data-id="' + prefix + '">导出本章记录</button>' +
      '</div>';
    return h;
  }

    groups.forEach(function (g, gi) {
      g.items.forEach(function (it, ii) {
        total++;
        var v = checks[toolId + ':' + gi + ':' + ii];
        if (v === 'y') done++; else if (v === 'x') skip++;
      });
    });
    var base = total - skip;
    var pct = base > 0 ? Math.round(done / base * 100) : 0;

    var h = '<div class="progress-line">' +
      '<div class="progress-track"><i style="width:' + pct + '%"></i></div>' +
      '<div class="progress-txt"><span>完成 ' + done + ' / ' + base + '</span><span>' + pct + '%</span></div></div>';

    h += '<div class="filters">' +
      '<button class="chip on" data-act="filter" data-id="all">全部</button>' +
      '<button class="chip" data-act="filter" data-id="todo">待处理</button>' +
      '<button class="chip" data-act="filter" data-id="done">已完成</button>' +
      '<button class="chip" data-act="filter" data-id="bad">有问题</button>' +
      '</div>';

    h += groups.map(function (g, gi) {
      return '<div class="acc" data-group="' + gi + '">' +
        '<button class="acc-head" data-act="acc">' +
          '<b>' + esc(g.name) + '</b>' +
          '<span class="acc-count">' + g.items.length + ' 项</span>' +
          '<span class="exp-arrow">›</span>' +
        '</button>' +
        '<div class="acc-body">' + g.items.map(function (it, ii) {
          var id = toolId + ':' + gi + ':' + ii;
          var v = checks[id] || '';
          var nv = notes[id] || '';
          return '<div class="ck">' +
            '<div class="ck-main">' +
              '<div class="ck-t">' + esc(it.t) +
                (it.photo ? '<span class="must" style="color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:var(--ok-soft)">📷 拍照</span>' : '') +
                (it.must ? '<span class="must">重点</span>' : '') +
              '</div>' +
              (it.tip ? '<div class="ck-tip">' + esc(it.tip) + '</div>' : '') +
              '<div class="ck-opts">' +
                opt(id, 'y', '已确认', v) + opt(id, 'n', '有问题', v) + opt(id, 'x', '不适用', v) +
              '</div>' +
              '<div class="ck-note"><input data-act="note" data-id="' + id + '" placeholder="备注：现场情况 / 金额 / 对方承诺" value="' + esc(nv) + '"></div>' +
            '</div>' +
          '</div>';
        }).join('') + '</div></div>';
    }).join('');

    h += '<div class="btn-row">' +
      '<button class="btn ghost" data-act="ck-reset" data-id="' + toolId + '">重置全部</button>' +
      '<button class="btn" data-act="ck-export" data-id="' + toolId + '">导出核对记录</button>' +
      '</div>';
    return h;

      '<div class="talk">' + list.map(function (t) {
