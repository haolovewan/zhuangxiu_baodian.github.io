  /* ---------------- 视图：装企对比评分表 ---------------- */
  var DIMS = T.scoreDims || [];

  function companyScore(c) {
    var tot = 0;
    DIMS.forEach(function (d, i) { tot += (Number(c.scores[i]) || 0) * d.w; });
    return Math.round(tot / 5 * 10) / 10;
  }

  function scoreHTML() {
    var ranked = companies.map(function (c) { return { c: c, s: companyScore(c) }; })
      .sort(function (a, b) { return b.s - a.s; });
    var ranks = {};
    ranked.forEach(function (r, i) { ranks[r.c.id] = i + 1; });

    var h = '<div class="score-wrap"><table class="score-table"><thead><tr>' +
      '<th style="min-width:120px">评分维度</th><th style="width:60px">权重</th>' +
      companies.map(function (c) {
        return '<th><input type="text" data-act="cname" data-id="' + c.id + '" value="' + esc(c.name) + '"></th>';
      }).join('') + '</tr></thead><tbody>';

    DIMS.forEach(function (d, i) {
      h += '<tr><td class="dim">' + esc(d.n) + '<small>' + esc(d.bad) + '</small></td>' +
        '<td style="white-space:nowrap">' + d.w + '%</td>' +
        companies.map(function (c) {
          var v = Number(c.scores[i]) || 0;
          var stars = '';
          for (var k = 1; k <= 5; k++) {
            stars += '<button class="' + (k <= v ? 'on' : '') + '" data-act="star" data-c="' + c.id +
              '" data-d="' + i + '" data-v="' + k + '">★</button>';
          }
          return '<td><div class="stars">' + stars + '</div></td>';
        }).join('') + '</tr>';
    });

    h += '<tr><td class="dim"><b>加权总分</b><small>满分 100，分数越高越稳</small></td><td></td>' +
      companies.map(function (c) {
        var rk = ranks[c.id];
        return '<td><span class="score-total' + (rk === 1 ? ' rank-1' : '') + '">' +
          companyScore(c).toFixed(1) + (rk === 1 ? ' 🥇' : '') + '</span></td>';
      }).join('') + '</tr>';

    h += '</tbody></table></div>';

    h += '<div class="btn-row">' +
      '<button class="btn ghost" data-act="add-co">+ 加一家公司</button>' +
      (companies.length > 2 ? '<button class="btn warn" data-act="del-co">删最后一家</button>' : '') +
      '<button class="btn" data-act="score-export">导出对比表</button>' +
      '</div>';

    h += '<div class="hint-box">评分建议：不要只看总分。看「报价完整度 + 报价透明度 + 付款节点」这三项 —— 它们决定了后期你还会不会再掏钱。</div>';

    // 各公司备注
    h += '<section class="sec"><div class="sec-head"><h3>现场印象备注</h3></div>' +
      companies.map(function (c) {
        return '<div class="card" style="margin-bottom:10px">' +
          '<b style="display:block;font-size:.88rem;margin-bottom:6px">' + esc(c.name) + '</b>' +
          '<div class="ck-note"><input data-act="cmemo" data-id="' + c.id + '" placeholder="记下：谁接待的 / 是否主动提示风险 / 报价给得是否爽快 / 催签的力度" value="' + esc(c.cmemo || '') + '"></div>' +
        '</div>';
      }).join('') + '</section>';

    return h;
  }

  /* ---------------- 视图：我的 ---------------- */
  function viewMine() {
    var readCount = ORDER.filter(function (s) { return read[s]; }).length;
    var exCount = 0, exDone = 0;
    ORDER.forEach(function (s) {
      var ex = E[s]; if (!ex || !ex.evidence) return;
      exCount += ex.evidence.length;
      ex.evidence.forEach(function (_, i) { if (checks['ev:' + s + ':' + i] === 'y') exDone++; });
    });
    var tk = ckStats('quote'), sg = ckStats('sign'), ac = ckStats('accept');

    var h = '<header class="topbar"><h1>我的</h1>' +
      '<button class="icon-btn" data-act="go" data-to="home">🏠</button></header>';

    h += '<section class="sec" style="padding-top:14px"><div class="stat-bar">' +
      '<div class="stat-box"><b>' + readCount + '/12</b><span>已读章节</span></div>' +
      '<div class="stat-box"><b>' + tk.pct + '%</b><span>报价自查</span></div>' +
      '<div class="stat-box"><b>' + sg.pct + '%</b><span>签约复核</span></div>' +
      '<div class="stat-box"><b>' + ac.pct + '%</b><span>验收进度</span></div>' +
      '</div></section>';

    h += '<section class="sec"><div class="sec-head"><h3>阅读设置</h3></div>' +
      '<div class="card" style="padding:0">' +
        '<div class="setting-row"><b>主题</b><span class="seg">' +
          segBtn('theme', 'light', '浅色', prefs.theme) + segBtn('theme', 'dark', '深色', prefs.theme) +
        '</span></div>' +
        '<div class="setting-row"><b>正文字号</b><span class="seg">' +
          segBtn('fs', '15', '小', String(prefs.fs)) + segBtn('fs', '16', '中', String(prefs.fs)) + segBtn('fs', '18', '大', String(prefs.fs)) +
        '</span></div>' +
      '</div></section>';

    h += '<section class="sec"><div class="sec-head"><h3>数据</h3></div>' +
      '<div class="card" style="padding:0">' +
        '<div class="setting-row"><b>章节留证清单</b><span style="font-size:.8rem;color:var(--muted)">' + exDone + ' / ' + exCount + '</span></div>' +
        '<div class="setting-row"><b>装企评分记录</b><span style="font-size:.8rem;color:var(--muted)">' + companies.length + ' 家</span></div>' +
      '<div class="setting-row"><b>存储位置</b><span style="font-size:.8rem;color:var(--muted)">仅本机浏览器</span></div>' +
      '</div></section>';

    h += '<div class="btn-row">' +
      '<button class="btn ghost" data-act="export-all">导出全部记录</button>' +
      '<button class="btn warn" data-act="clear-all">清空全部数据</button>' +
      '</div>';

    h += footerHTML();
    return h;
  }

  function segBtn(kind, val, label, cur) {
    return '<button class="' + (cur === val ? 'on' : '') + '" data-act="set" data-k="' + kind +
      '" data-v="' + val + '">' + label + '</button>';
  }

  function ckStats(toolId) {
    var g = toolId === 'quote' ? T.quote.groups : toolId === 'sign' ? T.sign.groups : T.accept.groups;
    var total = 0, done = 0, skip = 0;
    g.forEach(function (grp, gi) {
      grp.items.forEach(function (it, ii) {
        total++;
        var v = checks[toolId + ':' + gi + ':' + ii];
        if (v === 'y') done++; else if (v === 'x') skip++;
      });
    });
    var base = total - skip;
    return { total: total, done: done, skip: skip, pct: base > 0 ? Math.round(done / base * 100) : 0 };
  }

  /* ---------------- 导出 ---------------- */
  function buildReport() {
    var L = [];
    L.push('装修不上当 · 我的核对记录');
    L.push('导出时间：' + new Date().toLocaleString());
    L.push('');

    L.push('【一、装企对比评分】');
    companies.forEach(function (c) {
      L.push('  ' + c.name + '：加权总分 ' + companyScore(c).toFixed(1) + ' / 100');
      DIMS.forEach(function (d, i) {
        L.push('    - ' + d.n + '（' + d.w + '%）：' + (Number(c.scores[i]) || 0) + ' / 5');
      });
      if (c.cmemo) L.push('    备注：' + c.cmemo);
    });
    L.push('');

    [['报价单逐项核对', T.quote], ['签约前复核清单', T.sign], ['分阶段验收清单', T.accept]]
      .forEach(function (pair) {
        L.push('【' + pair[0] + '】');
        pair[1].groups.forEach(function (g, gi) {
          L.push('  ' + g.name);
          g.items.forEach(function (it, ii) {
            var id = pair[1] === T.quote ? 'quote' : pair[1] === T.sign ? 'sign' : 'accept';
            var v = checks[id + ':' + gi + ':' + ii];
            var mark = v === 'y' ? '[√]' : v === 'n' ? '[×]' : v === 'x' ? '[-]' : '[ ]';
            L.push('    ' + mark + ' ' + it.t);
            if (notes[id + ':' + gi + ':' + ii]) L.push('        备注：' + notes[id + ':' + gi + ':' + ii]);
          });
        });
        L.push('');
      });

    L.push('【二、全流程地图进度】');
    (F.stages || []).forEach(function (s) {
      L.push('  阶段 ' + s.no + ' ' + s.name + '：' + flowProgress(s) + '%');
    });
    L.push('');

    L.push('【三、各章留证清单】');
    ORDER.forEach(function (slug) {
      var ex = E[slug]; if (!ex || !ex.evidence || !ex.evidence.length) return;
      L.push('  ' + C[slug].title);
      ex.evidence.forEach(function (e, i) {
        L.push('    ' + (checks['ev:' + slug + ':' + i] === 'y' ? '[√]' : '[ ]') + ' ' + e);
      });
    });
    return L.join('\n');
  }

  function showExport(text, title) {
    var box = '<section class="sec"><div class="sec-head"><div><span class="eyebrow">导出</span><h3>' +
      esc(title || '导出记录') + '</h3></div></div>' +
      '<div class="export"><textarea id="expText" readonly>' + esc(text) + '</textarea>' +
      '<div class="btn-row" style="padding:10px 0 0">' +
        '<button class="btn ghost" data-act="copy-exp">复制全文</button>' +
        '<button class="btn" data-act="dl-exp">下载 txt</button>' +
      '</div></div></section>';
    var app = $('#app');
    var tmp = document.createElement('div');
    tmp.innerHTML = box;
    app.appendChild(tmp.firstChild);
    tmp.firstChild.scrollIntoView({ behavior: 'smooth' });
  }

  function download(name, text) {
    var blob = new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'go') {
      var to = el.getAttribute('data-to') || 'home';
      if (!to || to.slice(-1) === '/') { toast('已经是边界章节'); return; }
      go(to);
      return;
    }
    if (act === 'tab') {
      var slug = (route().arg);
      go('chapters/' + slug + '/' + el.getAttribute('data-id'));
      return;
    }
    if (act === 'exp') {
      el.parentNode.classList.toggle('open'); return;
    }
    if (act === 'talk') {
      el.parentNode.classList.toggle('open'); return;
    }
    if (act === 'acc') {
      var a = el.parentNode; a.classList.toggle('open');
      return;
    }
    if (act === 'dgcat') {
      dgCurCat = el.getAttribute('data-id') || '';
      render();
      return;
    }
    if (act === 'acc-all') {
      var openAll = el.getAttribute('data-v') === '1';
      $$('#app .acc').forEach(function (ac) { ac.classList.toggle('open', openAll); });
      return;
    }
    if (act === 'ck') {
      var id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
      checks[id] = (checks[id] === v) ? '' : v;
      DB.set('checks', checks);
      render();
      return;
    }
    if (act === 'filter') {
      var f = el.getAttribute('data-id');
      $$('.filters .chip').forEach(function (c) { c.classList.toggle('on', c === el); });
      $$('#app .acc').forEach(function (acc) {
        var gi = acc.getAttribute('data-group');
        var visible = false;
        $$('.ck', acc).forEach(function (ck) {
          var cid = ck.querySelector('.opt').getAttribute('data-id');
          var val = checks[cid] || '';
          var show = f === 'all' ||
            (f === 'todo' && val !== 'y' && val !== 'x') ||
            (f === 'done' && val === 'y') ||
            (f === 'bad' && val === 'n');
          ck.style.display = show ? '' : 'none';
          if (show) visible = true;
        });
        acc.style.display = visible ? '' : 'none';
        if (visible) acc.classList.add('open');
      });
      return;
    }
    if (act === 'ck-reset') {
      var p = el.getAttribute('data-id');
      Object.keys(checks).forEach(function (k) {
        if (p === 'ev' ? k.indexOf('ev:') === 0 : k.indexOf(p + ':') === 0) delete checks[k];
      });
      DB.set('checks', checks); render(); toast('已重置'); return;
    }
    if (act === 'ck-export') {
      var tid = el.getAttribute('data-id');
      var out = [];
      if (tid.indexOf('fl:') === 0 || tid.indexOf('fe:') === 0) {
        var fk = tid.slice(3), fs2 = flowStage(fk);
        if (fs2) {
          out.push('全流程地图 · 阶段 ' + fs2.no + ' ' + fs2.name);
          out.push('  【这一阶段要做什么】');
          (fs2.tasks || []).forEach(function (t, i) {
            out.push('    ' + (checks['fl:' + fk + ':' + i] === 'y' ? '[√]' : '[ ]') + ' ' + t.t);
            if (notes['fl:' + fk + ':' + i]) out.push('        备注：' + notes['fl:' + fk + ':' + i]);
          });
          out.push('  【这一步要留下什么】');
          (fs2.evidence || []).forEach(function (e, i) {
            out.push('    ' + (checks['fe:' + fk + ':' + i] === 'y' ? '[√]' : '[ ]') + ' ' + e);
            if (notes['fe:' + fk + ':' + i]) out.push('        备注：' + notes['fe:' + fk + ':' + i]);
          });
        }
      } else if (tid === 'quote' || tid === 'sign' || tid === 'accept') {
        var src = tid === 'quote' ? T.quote : tid === 'sign' ? T.sign : T.accept;
        out.push(src.title);
        src.groups.forEach(function (g, gi) {
          out.push('  ' + g.name);
          g.items.forEach(function (it, ii) {
            var v = checks[tid + ':' + gi + ':' + ii];
            out.push('    ' + (v === 'y' ? '[√]' : v === 'n' ? '[×]' : v === 'x' ? '[-]' : '[ ]') + ' ' + it.t);
            if (notes[tid + ':' + gi + ':' + ii]) out.push('        备注：' + notes[tid + ':' + gi + ':' + ii]);
          });
        });
      } else {
        var s2 = route().arg;
        out.push(C[s2].title + ' · 落地清单');
        (E[s2].evidence || []).forEach(function (e, i) {
          out.push('  ' + (checks['ev:' + s2 + ':' + i] === 'y' ? '[√]' : '[ ]') + ' ' + e);
        });
      }
      showExport(out.join('\n'), '导出记录'); return;
    }
    if (act === 'star') {
      var cid = el.getAttribute('data-c'), di = el.getAttribute('data-d'), sv = Number(el.getAttribute('data-v'));
      var co = companies.filter(function (x) { return x.id === cid; })[0];
      if (!co) return;
      co.scores[di] = (Number(co.scores[di]) === sv) ? 0 : sv;
      DB.set('companies', companies);
      render(); return;
    }
    if (act === 'add-co') {
      companies.push({ id: 'c' + Date.now(), name: '装修公司 ' + (companies.length + 1), scores: {}, cmemo: '' });
      DB.set('companies', companies); render(); toast('已添加'); return;
    }
    if (act === 'del-co') {
      companies.pop(); DB.set('companies', companies); render(); toast('已删除'); return;
    }
    if (act === 'score-export') {
      var r = ['装企对比评分表', '导出时间：' + new Date().toLocaleString(), ''];
      companies.map(function (c) { return { c: c, s: companyScore(c) }; })
        .sort(function (a, b) { return b.s - a.s; })
        .forEach(function (x, i) {
          r.push((i + 1) + '. ' + x.c.name + ' —— ' + x.s.toFixed(1) + ' 分');
          DIMS.forEach(function (d, di) { r.push('    - ' + d.n + '（' + d.w + '%）：' + (Number(x.c.scores[di]) || 0) + '/5'); });
          if (x.c.cmemo) r.push('    备注：' + x.c.cmemo);
          r.push('');
        });
      showExport(r.join('\n'), '装企对比表'); return;
    }
    if (act === 'export-all') { showExport(buildReport(), '全部记录'); return; }
    if (act === 'copy-exp') {
      var ta = $('#expText'); ta.select();
      try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch (e) { toast('请手动长按选择复制'); }
      return;
    }
    if (act === 'dl-exp') {
      download('装修核对记录-' + new Date().toISOString().slice(0, 10) + '.txt', $('#expText').value); return;
    }
    if (act === 'set') {
      var k = el.getAttribute('data-k'), vv = el.getAttribute('data-v');
      if (k === 'theme') prefs.theme = vv; else prefs.fs = Number(vv);
      DB.set('prefs', prefs); applyPrefs(); render(); return;
    }
    if (act === 'clear-all') {
      if (!confirm('将清空本机保存的全部勾选与备注，确定继续？')) return;
      ['checks', 'notes', 'read', 'companies'].forEach(DB.del);
      checks = {}; notes = {}; read = {};
      companies = [{ id: 'c1', name: '装修公司 A', scores: {}, cmemo: '' },
                   { id: 'c2', name: '装修公司 B', scores: {}, cmemo: '' }];
      render(); toast('已清空'); return;
    }
    if (act === 'stage') {
      curStage = el.getAttribute('data-id'); render(); return;
    }
    if (act === 'open-tool') {
      go('tools/' + el.getAttribute('data-id')); return;
    }
    if (act === 'search') {
      render(); return;
    }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.id === 'kw') { kw = el.value; render(); var n = $('#kw'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } return; }
    if (el.getAttribute && el.getAttribute('data-act') === 'note') {
      notes[el.getAttribute('data-id')] = el.value; DB.set('notes', notes); return;
    }
    if (el.getAttribute && el.getAttribute('data-act') === 'cmemo') {
      var cid = el.getAttribute('data-id');
      var co = companies.filter(function (x) { return x.id === cid; })[0];
      if (co) { co.cmemo = el.value; DB.set('companies', companies); }
      return;
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'kw' && ev.key === 'Enter') ev.target.blur();
  });

  /* ---------------- 偏好 ---------------- */
  function applyPrefs() {
    document.documentElement.setAttribute('data-theme', prefs.theme || 'light');
    document.documentElement.style.setProperty('--fs', (prefs.fs || 16) + 'px');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', prefs.theme === 'dark' ? '#1c1a17' : '#b8541f');
  }

  /* ---------------- 底部导航 ---------------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('#tabbar .tab');
    if (!b) return;
    go(b.getAttribute('data-route'));
  });

  window.addEventListener('hashchange', render);
  window.addEventListener('scroll', updateProgress, { passive: true });

  applyPrefs();
  if (!location.hash) location.hash = '#/home';
  render();
})();

</script>
</body>
</html>
